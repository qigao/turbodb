name: TurboDB native SDK release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turbodb-native-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    if: >-
      github.ref_type == 'tag' ||
      (github.ref_name == 'master' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: publish TurboDB package')))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: version
        name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          test -n "$version"
          tag="v$version"
          source_commit="$(git rev-parse HEAD)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "release tag mismatch: pushed=$GITHUB_REF_NAME expected=$tag" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

  sdk:
    needs: metadata
    uses: ./.github/workflows/native-sdk.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      require_stable: true

  pack:
    name: Pack TurboDB.Native
    needs: [metadata, sdk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: turbodb-sdk-*
          path: package/sdk
          merge-multiple: false

      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          for rid in linux-x64 linux-arm64 macos-arm64 windows-x64 android-arm64-v8a; do
            mv "package/sdk/turbodb-sdk-$rid" "package/sdk/$rid"
          done

      - name: Verify stable native SDK provenance and ELF SONAME closure
        shell: bash
        run: |
          set -euo pipefail
          stable_salts=""
          stable_utils=""
          for rid in linux-x64 linux-arm64 macos-arm64 windows-x64 android-arm64-v8a; do
            manifest="package/sdk/$rid/turbodb-sdk-manifest.txt"
            test -f "$manifest"
            salts="$(sed -n 's/^salts=//p' "$manifest")"
            utils="$(sed -n 's/^saltsutils=//p' "$manifest")"
            if [[ ! "$salts" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ ! "$utils" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable TurboDB.Native cannot publish RC SDK dependencies: rid=$rid salts=$salts saltsutils=$utils" >&2
              exit 1
            fi
            if [[ -n "$stable_salts" && "$salts" != "$stable_salts" ]] ||
               [[ -n "$stable_utils" && "$utils" != "$stable_utils" ]]; then
              echo "Native producer versions disagree across RIDs: $rid" >&2
              exit 1
            fi
            stable_salts="$salts"
            stable_utils="$utils"
          done

          command -v readelf >/dev/null
          wanted="libsalts.so.${stable_salts%.*}"
          matching=0
          while IFS= read -r -d '' library; do
            while IFS= read -r needed; do
              case "$needed" in
                libsalts.so.*)
                  if [[ "$needed" != "$wanted" ]]; then
                    echo "TurboDB ELF NEEDED mismatch: $library requires $needed, stable Salts.Native=$stable_salts ($wanted)" >&2
                    exit 1
                  fi
                  matching=$((matching + 1))
                  ;;
              esac
            done < <(readelf -d "$library" | sed -nE 's/.*Shared library: \[([^]]+)\].*/\1/p')
          done < <(find package/sdk/linux-x64 -type f -name '*.so*' -print0)
          if (( matching == 0 )); then
            echo "No Linux shared object proves the stable Salts native runtime dependency" >&2
            exit 1
          fi
          {
            echo "### Stable TurboDB.Native runtime graph"
            echo
            echo "- Salts.Native: $stable_salts"
            echo "- SaltsUtils.Native: $stable_utils"
            echo "- Linux NEEDED: $wanted ($matching imports)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/turbodb-pack.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source "https://nuget.pkg.github.com/qigao/index.json" \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Create NuGet package
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/TurboDB.Native.csproj \
            --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget" \
            --no-cache --force-evaluate
          dotnet pack packaging/nuget/TurboDB.Native.csproj \
            --no-restore --configuration Release --output dist \
            -p:PackageVersion=${{ needs.metadata.outputs.version }} \
            -p:PackageRoot="$GITHUB_WORKSPACE/package" \
            -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget" \
            -p:RepositoryCommit="$GITHUB_SHA"

      - name: Run package tests
        env:
          TURBODB_NUPKG: dist/TurboDB.Native.${{ needs.metadata.outputs.version }}.nupkg
        run: python3 -m unittest discover -s packaging/tests -p '*_test.py' -v

      - uses: actions/upload-artifact@v4
        with:
          name: TurboDB.Native.${{ needs.metadata.outputs.version }}
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    needs: [metadata, pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TurboDB.Native.${{ needs.metadata.outputs.version }}
          path: dist

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create bootstrap tag when needed
        if: github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
            test "$existing" = "$SOURCE_COMMIT"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_COMMIT"
          fi

      - name: Publish to qigao GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source "https://nuget.pkg.github.com/qigao/index.json" \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text
          dotnet nuget push "dist/TurboDB.Native.${{ needs.metadata.outputs.version }}.nupkg" \
            --api-key "$GITHUB_TOKEN" --source github --skip-duplicate

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; package publish was idempotent"
            exit 0
          fi
          gh release create "$TAG" dist/*.nupkg \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "TurboDB $VERSION" --generate-notes

name: vcpkg registry contract

on:
  pull_request:
    branches: [master]
    paths:
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "tidesdb/vcpkg.json"
      - "tidesdb/vcpkg-configuration.json"
      - "presets/Options.json"
      - ".github/workflows/vcpkg-registry-contract.yml"
  push:
    branches: [master]
    paths:
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "tidesdb/vcpkg.json"
      - "tidesdb/vcpkg-configuration.json"
      - "presets/Options.json"
      - ".github/workflows/vcpkg-registry-contract.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turbodb-vcpkg-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  registry-contract:
    name: ${{ matrix.os }} central registry
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact TurboDB head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure canonical vcpkg tool and shared cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Prepare Linux host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison flex libtool nasm ninja-build pkg-config perl

      - name: Prepare Windows host dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm ninja -y --no-progress

      - name: Resolve TurboDB PostgreSQL through central registry on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          unset VCPKG_OVERLAY_PORTS
          install_root="$RUNNER_TEMP/turbodb-vcpkg-registry"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$install_root" \
            --triplet=x64-linux \
            --x-feature=postgresql
          status="$install_root/vcpkg/status"
          test -f "$status"
          grep -F "Package: libpq" "$status"
          grep -F "Package: zstd" "$status"
          grep -F "Package: boringssl" "$status"

      - name: Resolve TurboDB PostgreSQL through central registry on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:VCPKG_OVERLAY_PORTS -ErrorAction SilentlyContinue
          $installRoot = Join-Path $env:RUNNER_TEMP "turbodb-vcpkg-registry"
          & (Join-Path $env:VCPKG_ROOT "vcpkg.exe") install `
            "--x-manifest-root=$env:GITHUB_WORKSPACE" `
            "--x-install-root=$installRoot" `
            "--triplet=x64-windows" `
            "--x-feature=postgresql"
          if ($LASTEXITCODE -ne 0) { throw "TurboDB PostgreSQL registry install failed" }
          $status = Join-Path $installRoot "vcpkg\status"
          if (-not (Test-Path -LiteralPath $status -PathType Leaf)) { throw "missing $status" }
          $text = Get-Content -LiteralPath $status -Raw
          foreach ($package in @("libpq", "zstd", "boringssl")) {
            if ($text -notmatch "(?m)^Package: $package$") { throw "missing installed package: $package" }
          }

      - name: Resolve TidesDB zstd through central registry on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          unset VCPKG_OVERLAY_PORTS
          install_root="$RUNNER_TEMP/tidesdb-vcpkg-registry"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE/tidesdb" \
            --x-install-root="$install_root" \
            --triplet=x64-linux
          status="$install_root/vcpkg/status"
          test -f "$status"
          grep -F "Package: zstd" "$status"

      - name: Resolve TidesDB zstd through central registry on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:VCPKG_OVERLAY_PORTS -ErrorAction SilentlyContinue
          $installRoot = Join-Path $env:RUNNER_TEMP "tidesdb-vcpkg-registry"
          & (Join-Path $env:VCPKG_ROOT "vcpkg.exe") install `
            "--x-manifest-root=$env:GITHUB_WORKSPACE\tidesdb" `
            "--x-install-root=$installRoot" `
            "--triplet=x64-windows"
          if ($LASTEXITCODE -ne 0) { throw "TidesDB registry install failed" }
          $status = Join-Path $installRoot "vcpkg\status"
          if (-not (Test-Path -LiteralPath $status -PathType Leaf)) { throw "missing $status" }
          $text = Get-Content -LiteralPath $status -Raw
          if ($text -notmatch "(?m)^Package: zstd$") { throw "missing installed package: zstd" }

      - name: Verify exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code

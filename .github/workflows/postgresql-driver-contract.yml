name: PostgreSQL live and SQL validation tests

on:
  pull_request:
    branches: [master]
    paths:
      - "drivers/postgresql/**"
      - "drivers/sqlite/**"
      - "orm/tests/e2e/postgresql/**"
      - "orm/tests/e2e/cross_driver/**"
      - "dbtools/postgresql/**"
      - "dbtools/tests/pgsql/**"
      - "dbtools/CMakeLists.txt"
      - "dbtools/src/**"
      - "dbtools/tests/CMakeLists.txt"
      - "orm/include/**"
      - "orm/src/**"
      - "orm/CMakeLists.txt"
      - "orm/tests/CMakeLists.txt"
      - "orm/tests/e2e/CMakeLists.txt"
      - "orm/tests/support/**"
      - "drivers/CMakeLists.txt"
      - "drivers/schema/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMake*Presets.json"
      - "presets/**"
      - "cmake/**"
      - ".github/actions/**"
      - "vcpkg*.json"
      - ".github/workflows/postgresql-driver-contract.yml"
  push:
    branches: [master]
    paths:
      - "drivers/postgresql/**"
      - "drivers/sqlite/**"
      - "orm/tests/e2e/postgresql/**"
      - "orm/tests/e2e/cross_driver/**"
      - "dbtools/postgresql/**"
      - "dbtools/tests/pgsql/**"
      - "dbtools/CMakeLists.txt"
      - "dbtools/src/**"
      - "dbtools/tests/CMakeLists.txt"
      - "orm/include/**"
      - "orm/src/**"
      - "orm/CMakeLists.txt"
      - "orm/tests/CMakeLists.txt"
      - "orm/tests/e2e/CMakeLists.txt"
      - "orm/tests/support/**"
      - "drivers/CMakeLists.txt"
      - "drivers/schema/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMake*Presets.json"
      - "presets/**"
      - "cmake/**"
      - ".github/actions/**"
      - "vcpkg*.json"
      - ".github/workflows/postgresql-driver-contract.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: sql-validation-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation-parity:
    name: PostgreSQL 17.6 + SQLite ValidationPlan parity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: turbodb
          POSTGRES_USER: turbodb
          POSTGRES_PASSWORD: turbodb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U turbodb -d turbodb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout exact TurboDB head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-native

      - name: Install Ninja
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Restore published Salts SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64

      - name: Build and run cross-Driver ValidationPlan parity
        shell: bash
        env:
          TURBODB_DBTOOLS_PG_TEST_CONNINFO: "host=127.0.0.1 port=5432 dbname=turbodb user=turbodb password=turbodb"
          TURBODB_ORM_PGSQL_TEST_CONNINFO: "host=127.0.0.1 port=5432 dbname=turbodb user=turbodb password=turbodb"
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/evidence/sql-validation-parity"
          mkdir -p "$evidence"

          cmake --preset ci-linux-e2e

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "vcpkg_installed"
          status = root / "vcpkg" / "status"
          text = status.read_text(encoding="utf-8")
          libpq = []
          for paragraph in text.split("\n\n"):
              fields = {}
              for line in paragraph.splitlines():
                  if ": " in line:
                      key, value = line.split(": ", 1)
                      fields[key] = value
              if fields.get("Package") == "libpq":
                  libpq.append(fields)

          if not libpq:
              raise SystemExit("libpq is missing from the installed PostgreSQL closure")

          features = {entry.get("Feature", "core") for entry in libpq}
          if "ssl" in features:
              raise SystemExit(f"libpq unexpectedly enabled ssl feature: {sorted(features)}")

          wrappers = list(root.glob("*/share/libpq/vcpkg-cmake-wrapper.cmake"))
          if not wrappers:
              raise SystemExit("installed libpq CMake wrapper was not found")
          wrapper = wrappers[0].read_text(encoding="utf-8").lower()
          if "openssl" in wrapper or "boringssl" in wrapper:
              raise SystemExit("libpq no-SSL wrapper leaked a TLS provider dependency")

          print("libpq no-SSL contract verified:", ", ".join(sorted(features)))
          PY

          cmake --build --preset ci-linux-e2e --target orm_sql_validation_parity_test orm_postgres_live_test orm_owner_postgres_test orm_owner_postgres_loss_test dbtool_postgresql_live_test --parallel 4

          ctest --preset ci-linux-e2e -R '^(orm_sql_validation_parity|orm_postgres_live|orm_owner_postgres|orm_owner_postgres_loss|dbtool_postgresql_live_test)$' \
            --output-on-failure --output-junit "$evidence/tests.xml" 2>&1 | tee "$evidence/ctest.log"

      - name: Keep PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-validation-parity-${{ github.sha }}
          path: evidence/sql-validation-parity/
          if-no-files-found: warn

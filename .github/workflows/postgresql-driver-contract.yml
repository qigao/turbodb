name: PostgreSQL live and SQL validation tests

on:
  pull_request:
    branches: [master]
    paths:
      - "drivers/**"
      - "dbtools/**"
      - "orm/**"
      - ".github/workflows/postgresql-driver-contract.yml"
  push:
    branches: [master]
    paths:
      - "drivers/**"
      - "dbtools/**"
      - "orm/**"
      - ".github/workflows/postgresql-driver-contract.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: sql-validation-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation-parity:
    name: PostgreSQL 17.6 + SQLite ValidationPlan parity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: turbodb
          POSTGRES_USER: turbodb
          POSTGRES_PASSWORD: turbodb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U turbodb -d turbodb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout exact TurboDB head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-native

      - name: Install Ninja
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure PostgreSQL 17 direct TLS fixtures
        shell: bash
        run: |
          set -euo pipefail
          tls="$RUNNER_TEMP/postgres-tls"
          mkdir -p "$tls"

          openssl genrsa -out "$tls/ca.key" 2048
          openssl req -x509 -new -key "$tls/ca.key" -sha256 -days 1 \
            -subj "/CN=TurboDB PostgreSQL Test CA" -out "$tls/ca.pem"

          openssl genrsa -out "$tls/server.key" 2048
          openssl req -new -key "$tls/server.key" -subj "/CN=localhost" \
            -out "$tls/server.csr"
          cat > "$tls/server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost
          authorityKeyIdentifier=keyid,issuer
          subjectKeyIdentifier=hash
          EOF
          openssl x509 -req -in "$tls/server.csr" \
            -CA "$tls/ca.pem" -CAkey "$tls/ca.key" -CAcreateserial \
            -days 1 -sha256 -extfile "$tls/server.ext" -out "$tls/server.crt"

          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj "/CN=TurboDB Wrong CA" \
            -keyout "$tls/wrong-ca.key" -out "$tls/wrong-ca.pem"

          container="$(docker ps --filter ancestor=postgres:17.6-alpine3.22 \
            --format '{{.ID}}' | head -n1)"
          test -n "$container"
          pgdata="$(docker exec "$container" sh -c 'printf %s "$PGDATA"')"
          test -n "$pgdata"

          docker cp "$tls/server.crt" "$container:$pgdata/server.crt"
          docker cp "$tls/server.key" "$container:$pgdata/server.key"
          docker exec "$container" chown postgres:postgres \
            "$pgdata/server.crt" "$pgdata/server.key"
          docker exec "$container" chmod 600 "$pgdata/server.key"
          docker exec -u postgres "$container" sh -ceu '
            {
              echo "ssl = on"
              echo "ssl_cert_file = '\''server.crt'\''"
              echo "ssl_key_file = '\''server.key'\''"
            } >> "$PGDATA/postgresql.conf"
            {
              echo "hostssl all turbodb 0.0.0.0/0 scram-sha-256"
              echo "hostssl all turbodb ::/0 scram-sha-256"
              cat "$PGDATA/pg_hba.conf"
            } > "$PGDATA/pg_hba.conf.new"
            mv "$PGDATA/pg_hba.conf.new" "$PGDATA/pg_hba.conf"
          '
          docker restart "$container" >/dev/null
          for _ in $(seq 1 30); do
            if docker exec "$container" pg_isready -U turbodb -d turbodb >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" pg_isready -U turbodb -d turbodb

          nohup openssl s_server -accept 55432 \
            -cert "$tls/server.crt" -key "$tls/server.key" \
            -alpn h2 -www >"$tls/wrong-alpn.log" 2>&1 &
          echo $! > "$tls/wrong-alpn.pid"

          echo "TURBODB_PG_TLS_PORT=5432" >> "$GITHUB_ENV"
          echo "TURBODB_PG_TLS_WRONG_ALPN_PORT=55432" >> "$GITHUB_ENV"
          echo "TURBODB_PG_TLS_CA=$tls/ca.pem" >> "$GITHUB_ENV"
          echo "TURBODB_PG_TLS_WRONG_CA=$tls/wrong-ca.pem" >> "$GITHUB_ENV"

      - name: Restore published Salts SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64

      - name: Build and run cross-Driver ValidationPlan parity
        shell: bash
        env:
          TURBODB_DBTOOLS_PG_TEST_CONNINFO: "host=127.0.0.1 port=5432 dbname=turbodb user=turbodb password=turbodb"
          TURBODB_ORM_PGSQL_TEST_CONNINFO: "host=127.0.0.1 port=5432 dbname=turbodb user=turbodb password=turbodb"
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/evidence/sql-validation-parity"
          mkdir -p "$evidence"

          cmake --preset ci-linux-e2e

          cmake --build --preset ci-linux-e2e --parallel 4

          ctest --preset ci-linux-e2e -R '^(orm_sql_validation_parity|orm_postgres_live|orm_postgres_direct_tls_live|orm_postgres_direct_tls_binding_mismatch|orm_owner_postgres|orm_owner_postgres_loss|dbtool_postgresql_live_test)$' \
            --output-on-failure --output-junit "$evidence/tests.xml" 2>&1 | tee "$evidence/ctest.log"

      - name: Keep PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-validation-parity-${{ github.sha }}
          path: evidence/sql-validation-parity/
          if-no-files-found: warn

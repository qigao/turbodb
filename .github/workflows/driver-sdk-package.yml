name: Driver SDK installed package
on:
  push:
    branches: [feat/runtime-driver-sdk-prefix, feat/runtime-driver-sdk-descriptors, feat/runtime-driver-sdk-handshake, feat/runtime-driver-sdk-consumers, feat/runtime-driver-sdk-plan-view, feat/orm-native-ownership, refactor/orm-databind-row-publisher]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Installed SDK (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        config: [debug, release]
    # Empty image disables the Linux-only disposable service on Windows and
    # branches that do not contain the native owner test target.
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-24.04' && (github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher') && 'postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929' || '' }}
        env:
          POSTGRES_USER: orm_owner_ci
          POSTGRES_PASSWORD: orm_owner_ci_only
          POSTGRES_DB: orm_owner_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U orm_owner_ci -d orm_owner_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: c4197712261a563ed7e238152b34cb50a2ef98a9
          path: .ci-salts
          persist-credentials: false
      - name: Check CI provenance regression
        shell: pwsh
        run: python -m unittest discover -s orm/tests/driver -p test_package_provenance.py -v
      - name: Set up Linux tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          test -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
      - name: Set up Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install re2c -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 're2c installation failed' }
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path -LiteralPath $toolchain)) { throw 'vcpkg toolchain is missing' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'x64 MSVC was not found' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Record exact dependency cache identity
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path -LiteralPath $env:VCPKG_ROOT).Path
          $revision = git -C $root rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg revision is unknown' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "DRIVER_SDK_VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "DRIVER_SDK_VCPKG_REVISION=$revision" >> $env:GITHUB_ENV
          Write-Output "vcpkg cache identity: root=$root revision=$revision"
          if (-not $env:ImageOS -or -not $env:ImageVersion) { throw 'runner image identity is missing' }
          $cache = Join-Path $env:GITHUB_WORKSPACE '.ci-vcpkg-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "key=$env:ImageOS-$env:ImageVersion-$revision" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binary packages
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-vcpkg-cache
          key: driver-sdk-vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}-${{ hashFiles('.ci-salts/vcpkg.json', '.ci-salts/vcpkg-configuration.json', '.ci-salts/vcpkg-ports/**') }}
      - name: Build real Salts package and test SDK on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 orm/tests/driver/run_package_contract.py --salts-source .ci-salts --config '${{ matrix.config }}'
      - name: Build real Salts package and test SDK on Windows
        env:
          # Avoid vcpkg telemetry self-copy locking its executable during parallel launches (#50).
          VCPKG_DISABLE_METRICS: '1'
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          echo VsDevCmd selected VCPKG_ROOT=%VCPKG_ROOT%
          rem Keep the explicitly selected runner toolchain used by the cache key.
          set "VCPKG_ROOT=%DRIVER_SDK_VCPKG_ROOT%"
          python orm/tests/driver/run_package_contract.py --salts-source .ci-salts --config "${{ matrix.config }}"
      # The core adapter uses the real core presets and backend dependencies.
      # Only CI machine paths change; the original backend/profile selections stay on.
      - name: Configure core preset paths for this runner
        if: (github.ref_name == 'feat/runtime-driver-sdk-plan-view' || github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $preset = Get-Content CMakeUserPresets.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($item in $preset.configurePresets) {
            if ($item.name -in @('win-toolchain', 'linux-paths')) {
              $item.environment.PROJECT_ROOT = $env:GITHUB_WORKSPACE
              $item.environment.PKG_ROOT = "$env:GITHUB_WORKSPACE/external/pkgs"
              $item.environment.VCPKG_ROOT = $env:DRIVER_SDK_VCPKG_ROOT
            }
          }
          $preset | ConvertTo-Json -Depth 30 | Set-Content CMakeUserPresets.json -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force -Path evidence/core | Out-Null
          git diff -- CMakeUserPresets.json > evidence/core/ci-paths.diff
          if ($LASTEXITCODE -ne 0) { throw 'cannot record CI path adaptation' }
      - name: Build and test native plan adapter on Linux
        if: (github.ref_name == 'feat/runtime-driver-sdk-plan-view' || github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          profile=linux-release-user
          build=build/linux-gcc-release
          if [[ '${{ matrix.config }}' == debug ]]; then
            profile=linux-dev-user
            build=build/linux-gcc-debug
          fi
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          git rev-parse HEAD | tee evidence/core/head.txt
          cmake --preset "$profile" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee evidence/core/configure.log
          cp "$build/compile_commands.json" evidence/core/compile_commands.json
          cp "$build/CMakeCache.txt" evidence/core/CMakeCache.txt
          cmake --build --preset "$profile" --target orm_postgres_flow_test orm_postgres_connection_test orm_driver_plan_view_test orm_sql_render_test orm_public_flow_test orm_cpp_flow_test orm_owner_regression_test orm_owner_state_test orm_owner_checked_test orm_owner_public_flow_test orm_owner_cpp_flow_test orm_owner_cleanup_test orm_owner_race_test orm_owner_failure_test --parallel 4 2>&1 | tee evidence/core/build.log
          ctest --preset "$profile" -R '^(orm_driver_plan_view|orm_sql_render|orm_public_flow|orm_cpp_flow|orm_postgres_flow|orm_postgres_connection)$' --verbose --no-tests=error 2>&1 | tee evidence/core/ctest.log
          ctest --preset "$profile" -R '^orm_owner_(regression|state|checked|public_flow|cpp_flow|cleanup|race|failure)$' --verbose --no-tests=error 2>&1 | tee evidence/core/ownership.log
      - name: Build and test native plan adapter on Windows
        env:
          # Avoid vcpkg telemetry self-copy locking its executable during parallel launches (#50).
          VCPKG_DISABLE_METRICS: '1'
        if: (github.ref_name == 'feat/runtime-driver-sdk-plan-view' || github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%DRIVER_SDK_VCPKG_ROOT%"
          set "ASAN_OPTIONS=halt_on_error=1"
          set "PROFILE=win-release-user"
          set "BUILD=build\Msvc-Release"
          if "${{ matrix.config }}"=="debug" set "PROFILE=win-dev-user"
          if "${{ matrix.config }}"=="debug" set "BUILD=build\Msvc"
          git rev-parse HEAD > evidence\core\head.txt
          if errorlevel 1 exit /b 1
          cmake --preset "%PROFILE%" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON > evidence\core\configure.log 2>&1
          if errorlevel 1 (type evidence\core\configure.log & exit /b 1)
          copy "%BUILD%\compile_commands.json" evidence\core\compile_commands.json
          if errorlevel 1 exit /b 1
          copy "%BUILD%\CMakeCache.txt" evidence\core\CMakeCache.txt
          if errorlevel 1 exit /b 1
          cmake --build --preset "%PROFILE%" --target orm_postgres_flow_test orm_postgres_connection_test orm_driver_plan_view_test orm_sql_render_test orm_public_flow_test orm_cpp_flow_test orm_owner_regression_test orm_owner_state_test orm_owner_checked_test orm_owner_public_flow_test orm_owner_cpp_flow_test orm_owner_cleanup_test orm_owner_race_test orm_owner_failure_test --parallel 4 > evidence\core\build.log 2>&1
          if errorlevel 1 (type evidence\core\build.log & exit /b 1)
          ctest --preset "%PROFILE%" -R "^(orm_driver_plan_view|orm_sql_render|orm_public_flow|orm_cpp_flow|orm_postgres_flow|orm_postgres_connection)$" --verbose --no-tests=error > evidence\core\ctest.log 2>&1
          if errorlevel 1 (type evidence\core\ctest.log & exit /b 1)
          type evidence\core\ctest.log
          ctest --preset "%PROFILE%" -R "^orm_owner_(regression|state|checked|public_flow|cpp_flow|cleanup|race|failure)$" --verbose --no-tests=error > evidence\core\ownership.log 2>&1
          if errorlevel 1 (type evidence\core\ownership.log & exit /b 1)
          type evidence\core\ownership.log
      - name: Verify native ownership against real PostgreSQL
        if: (github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Linux'
        shell: bash
        env:
          TURBODB_ORM_PGSQL_TEST_CONNINFO: host=127.0.0.1 port=${{ job.services.postgres.ports['5432'] }} dbname=orm_owner_ci user=orm_owner_ci password=orm_owner_ci_only connect_timeout=5 options='-c statement_timeout=5000'
        run: |
          set -euo pipefail
          profile=linux-release-user
          build=build/linux-gcc-release
          if [[ '${{ matrix.config }}' == debug ]]; then
            profile=linux-dev-user
            build=build/linux-gcc-debug
          fi
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          cmake --preset "$profile" -DORM_BUILD_TESTS=ON -DORM_POSTGRES_LIVE_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee evidence/core/postgres-configure.log
          cp "$build/compile_commands.json" evidence/core/postgres-compile-commands.json
          cmake --build --preset "$profile" --target orm_owner_postgres_test orm_owner_postgres_loss_test orm_postgres_live_test --parallel 4 2>&1 | tee evidence/core/postgres-build.log
          ctest --preset "$profile" -R '^(orm_owner_postgres|orm_owner_postgres_loss|orm_postgres_live)$' --verbose --no-tests=error 2>&1 | tee evidence/core/postgres-ctest.log
      # Run the entire configured root suite after the unchanged focused checks.
      # Linux keeps the live PostgreSQL service configured by the preceding step.
      - name: Build and test full root suite on Linux
        if: (github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Linux'
        shell: bash
        env:
          TURBODB_ORM_PGSQL_TEST_CONNINFO: host=127.0.0.1 port=${{ job.services.postgres.ports['5432'] }} dbname=orm_owner_ci user=orm_owner_ci password=orm_owner_ci_only connect_timeout=5 options='-c statement_timeout=5000'
        run: |
          set -euo pipefail
          profile=linux-release-user
          build=build/linux-gcc-release
          if [[ '${{ matrix.config }}' == debug ]]; then
            profile=linux-dev-user
            build=build/linux-gcc-debug
          fi
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          cp "$build/CMakeCache.txt" evidence/core/full-CMakeCache.txt
          cp "$build/compile_commands.json" evidence/core/full-compile-commands.json
          ctest --preset "$profile" --show-only=json-v1 > evidence/core/full-test-inventory.json
          cmake --build --preset "$profile" --parallel 4 2>&1 | tee evidence/core/full-build.log
          ctest --preset "$profile" --verbose --no-tests=error --output-junit "$GITHUB_WORKSPACE/evidence/core/full-ctest.xml" 2>&1 | tee evidence/core/full-ctest.log
      - name: Build and test full root suite on Windows
        if: (github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Windows'
        env:
          VCPKG_DISABLE_METRICS: '1'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%DRIVER_SDK_VCPKG_ROOT%"
          set "ASAN_OPTIONS=halt_on_error=1"
          set "PROFILE=win-release-user"
          set "BUILD=build\Msvc-Release"
          if "${{ matrix.config }}"=="debug" set "PROFILE=win-dev-user"
          if "${{ matrix.config }}"=="debug" set "BUILD=build\Msvc"
          copy "%BUILD%\CMakeCache.txt" evidence\core\full-CMakeCache.txt
          if errorlevel 1 exit /b 1
          copy "%BUILD%\compile_commands.json" evidence\core\full-compile-commands.json
          if errorlevel 1 exit /b 1
          ctest --preset "%PROFILE%" --show-only=json-v1 > evidence\core\full-test-inventory.json
          if errorlevel 1 (type evidence\core\full-test-inventory.json & exit /b 1)
          cmake --build --preset "%PROFILE%" --parallel 4 > evidence\core\full-build.log 2>&1
          if errorlevel 1 (type evidence\core\full-build.log & exit /b 1)
          ctest --preset "%PROFILE%" --verbose --no-tests=error --output-junit "%GITHUB_WORKSPACE%\evidence\core\full-ctest.xml" > evidence\core\full-ctest.log 2>&1
          if errorlevel 1 (type evidence\core\full-ctest.log & exit /b 1)
          type evidence\core\full-ctest.log
      - name: Save completed vcpkg binary packages
        if: always() && steps.identity.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-vcpkg-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Keep complete package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-package-${{ matrix.os }}-${{ matrix.config }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn

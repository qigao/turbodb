name: TurboDB CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turbodb-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: >-
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: publish TurboDB package')
    uses: ./.github/workflows/native-sdk.yml

name: Native build and tests

on:
  pull_request:
    branches: [master]
    paths:
      - "mysql/**"
      - "redis/**"
      - "orm/**"
      - "drivers/**"
      - "dbtools/**"
      - "tidesdb/**"
      - "tidessql/**"
      - "sqlparser/**"
      - "include/**"
      - "packaging/**"
      - "cmake/**"
      - "presets/**"
      - "tools/**"
      - "CMake*.txt"
      - "CMake*.cmake"
      - "CMake*.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [master]
    paths:
      - "mysql/**"
      - "redis/**"
      - "orm/**"
      - "drivers/**"
      - "dbtools/**"
      - "tidesdb/**"
      - "tidessql/**"
      - "sqlparser/**"
      - "include/**"
      - "packaging/**"
      - "cmake/**"
      - "presets/**"
      - "tools/**"
      - "CMake*.txt"
      - "CMake*.cmake"
      - "CMake*.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: native-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: >-
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: publish TurboDB package')
    uses: ./.github/workflows/native-sdk.yml

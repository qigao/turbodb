name: Driver SDK installed package
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, feat/runtime-driver-sdk-prefix, feat/runtime-driver-sdk-descriptors, feat/runtime-driver-sdk-handshake, feat/runtime-driver-sdk-consumers, feat/runtime-driver-sdk-plan-view, feat/orm-native-ownership, refactor/orm-databind-row-publisher, feat/public-retained-ownership, feat/runtime-driver-loader, feat/runtime-driver-cursor-adapter, feat/runtime-driver-command-adapter, feat/runtime-driver-transaction-adapter, feat/runtime-driver-registry-concurrency, feat/driver-backend-bridge, feat/driver-plugin-interface]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: driver-sdk-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Installed SDK (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        config: [debug, release]
    # Empty image disables the Linux-only disposable service on Windows and
    # branches that do not contain the native owner test target.
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-24.04' && ((github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher' || github.ref_name == 'feat/public-retained-ownership') || github.ref_name == 'refactor/orm-databind-row-publisher') && 'postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929' || '' }}
        env:
          POSTGRES_USER: orm_owner_ci
          POSTGRES_PASSWORD: orm_owner_ci_only
          POSTGRES_DB: orm_owner_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U orm_owner_ci -d orm_owner_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: master
          fetch-depth: 1
          path: .ci-salts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: master
          fetch-depth: 1
          path: .ci-salts-utils
          persist-credentials: false
      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Check CI provenance regression
        shell: pwsh
        run: python -m unittest discover -s orm/tests/driver -p test_package_provenance.py -v
      - name: Set up Linux toolchain identity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Set up Windows toolchain identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_ROOT)) { throw 'canonical VCPKG_ROOT is missing' }
          $toolchain = Join-Path $env:VCPKG_ROOT 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path -LiteralPath $toolchain)) { throw 'vcpkg toolchain is missing' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'x64 MSVC was not found' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
      - name: Verify master dependencies and compute content identity
        id: deps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Master([string]$repo, [string]$name) {
            $branch = git -C $repo branch --show-current
            if ($LASTEXITCODE -ne 0 -or $branch -cne 'master') {
              throw "$name must be checked out from master"
            }
            git -C $repo diff --exit-code
            if ($LASTEXITCODE -ne 0) { throw "$name master checkout is dirty" }
          }
          function Get-TrackedContentDigest([string]$repo) {
            $files = @(git -c core.quotepath=false -C $repo ls-files | Sort-Object)
            if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) {
              throw "cannot enumerate tracked dependency files"
            }
            $hash = [System.Security.Cryptography.IncrementalHash]::CreateHash(
              [System.Security.Cryptography.HashAlgorithmName]::SHA256)
            foreach ($relative in $files) {
              $normalized = $relative.Replace('\', '/')
              $nameBytes = [System.Text.Encoding]::UTF8.GetBytes($normalized + "`n")
              $hash.AppendData($nameBytes)
              $hash.AppendData([System.IO.File]::ReadAllBytes((Join-Path $repo $relative)))
            }
            $bytes = $hash.GetHashAndReset()
            $hash.Dispose()
            return -join ($bytes | ForEach-Object { $_.ToString('x2') })
          }
          Assert-Master '.ci-salts' 'Salts'
          Assert-Master '.ci-salts-utils' 'SaltsUtils'
          "salts=$(Get-TrackedContentDigest '.ci-salts')" >> $env:GITHUB_OUTPUT
          "salts_utils=$(Get-TrackedContentDigest '.ci-salts-utils')" >> $env:GITHUB_OUTPUT
      - name: Record exact dependency cache identity
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path -LiteralPath $env:VCPKG_ROOT).Path
          $revision = git -C $root rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg revision is unknown' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "DRIVER_SDK_VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "DRIVER_SDK_VCPKG_REVISION=$revision" >> $env:GITHUB_ENV
          Write-Output "vcpkg cache identity: root=$root revision=$revision"
          if (-not $env:ImageOS -or -not $env:ImageVersion) { throw 'runner image identity is missing' }
          "key=$env:ImageOS-$env:ImageVersion-$revision" >> $env:GITHUB_OUTPUT
      - name: Restore Salts master package
        id: salts-package-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            external/pkgs/salts/${{ matrix.config }}
            .ci-salts/vcpkg_installed
          key: driver-sdk-salts-master-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config }}-${{ steps.identity.outputs.key }}-${{ steps.deps.outputs.salts }}
      - name: Restore SaltsUtils master package
        id: salts-utils-package-cache
        uses: actions/cache/restore@v4
        with:
          path: external/pkgs/salts-utils/${{ matrix.config }}
          key: driver-sdk-salts-utils-master-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config }}-${{ steps.identity.outputs.key }}-${{ steps.deps.outputs.salts }}-${{ steps.deps.outputs.salts_utils }}
      - name: Install Linux dependency build prerequisites on package cache miss
        if: runner.os == 'Linux' && (steps.salts-package-cache.outputs.cache-hit != 'true' || steps.salts-utils-package-cache.outputs.cache-hit != 'true')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build or reuse Salts master and test SDK on Linux
        if: runner.os == 'Linux'
        env:
          SALTS_SOURCE_DIGEST: ${{ steps.deps.outputs.salts }}
        shell: bash
        run: |
          set -euo pipefail
          reuse=()
          if [[ '${{ steps.salts-package-cache.outputs.cache-hit }}' == 'true' ]]; then
            reuse+=(--reuse-salts-install)
          fi
          python3 orm/tests/driver/run_package_contract.py --salts-source .ci-salts --config '${{ matrix.config }}' "${reuse[@]}"
      - name: Build or reuse Salts master and test SDK on Windows
        env:
          # Avoid vcpkg telemetry self-copy locking its executable during parallel launches (#50).
          VCPKG_DISABLE_METRICS: '1'
          SALTS_SOURCE_DIGEST: ${{ steps.deps.outputs.salts }}
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          echo VsDevCmd selected VCPKG_ROOT=%VCPKG_ROOT%
          rem Keep the explicitly selected runner toolchain used by the cache key.
          set "VCPKG_ROOT=%DRIVER_SDK_VCPKG_ROOT%"
          set "REUSE_SALTS="
          if "${{ steps.salts-package-cache.outputs.cache-hit }}"=="true" set "REUSE_SALTS=--reuse-salts-install"
          python orm/tests/driver/run_package_contract.py --salts-source .ci-salts --config "${{ matrix.config }}" %REUSE_SALTS%
      - name: Save Salts master package
        if: steps.salts-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            external/pkgs/salts/${{ matrix.config }}
            .ci-salts/vcpkg_installed
          key: ${{ steps.salts-package-cache.outputs.cache-primary-key }}
      - name: Adapt SaltsUtils master preset paths for this runner
        if: steps.salts-utils-package-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE '.ci-salts-utils'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'evidence/salts-utils'
          git -C $source diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'SaltsUtils checkout is not clean before path adaptation' }
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $path = Join-Path $source 'CMakeUserPresets.json'
          $presets = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable
          foreach ($name in @('win-toolchain', 'linux-paths')) {
            $matches = @($presets.configurePresets | Where-Object { $_.name -eq $name })
            if ($matches.Count -ne 1) { throw "Missing or duplicate upstream path preset: $name" }
            $item = $matches[0]
            $item.environment.PKG_ROOT = "$env:GITHUB_WORKSPACE/external/pkgs"
            $item.environment.VCPKG_ROOT = $env:DRIVER_SDK_VCPKG_ROOT
            $item.environment.RE2C_ROOT = $env:RE2C_ROOT
            if ($name -eq 'win-toolchain') {
              $item.environment.PROJECT_ROOT = $env:GITHUB_WORKSPACE
            }
          }
          $presets | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $path -Encoding utf8NoBOM
          git -C $source diff -- CMakeUserPresets.json > "$evidence/ci-paths.diff"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot record SaltsUtils path adaptation' }
          Copy-Item -LiteralPath $path -Destination "$evidence/CMakeUserPresets.json"
          'master' | Set-Content -LiteralPath "$evidence/ref.txt" -Encoding utf8NoBOM
      - name: Build SaltsUtils master package on Linux
        if: runner.os == 'Linux' && steps.salts-utils-package-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          config='${{ matrix.config }}'
          profile=linux-release-user
          salts_utils_asan=OFF
          if [[ "$config" == debug ]]; then
            profile=linux-dev-user
            salts_utils_asan=ON
          fi
          salts_utils_root="$GITHUB_WORKSPACE/external/pkgs/salts-utils/$config"
          evidence="$GITHUB_WORKSPACE/evidence/salts-utils"
          cd .ci-salts-utils
          # Keep the existing dependency test/sanitizer policy; inherit package
          # features, toolchain, compiler flags and tool runtime paths upstream.
          cmake --preset "$profile" \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF \
            -DENABLE_SANITIZER_ADDRESS="$salts_utils_asan" -DENABLE_SANITIZER_UNDEFINED=OFF \
            2>&1 | tee "$evidence/configure.log"
          cmake --build --preset "$profile" --parallel 4 2>&1 | tee "$evidence/build.log"
          rm -rf "$salts_utils_root"
          cmake --build --preset "install-$profile" --parallel 4 2>&1 | tee "$evidence/install.log"
          test -f "$salts_utils_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$salts_utils_root/include/data_bind_native.h"
          test ! -e "$salts_utils_root/lib/cmake/DataBind"
          echo "SALTS_UTILS_ROOT=$salts_utils_root" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/evidence/core"
          printf '%s\n' master > "$GITHUB_WORKSPACE/evidence/core/salts-utils-ref.txt"

      - name: Build SaltsUtils master package on Windows
        env:
          VCPKG_DISABLE_METRICS: '1'
        if: runner.os == 'Windows' && steps.salts-utils-package-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%DRIVER_SDK_VCPKG_ROOT%"
          set "SALTS_ROOT=%GITHUB_WORKSPACE%\external\pkgs\salts\${{ matrix.config }}"
          set "SALTS_UTILS_ROOT=%GITHUB_WORKSPACE%\external\pkgs\salts-utils\${{ matrix.config }}"
          set "SALTS_UTILS_PROFILE=win-release-user"
          set "SALTS_UTILS_ASAN=OFF"
          if "${{ matrix.config }}"=="debug" set "SALTS_UTILS_PROFILE=win-dev-user"
          if "${{ matrix.config }}"=="debug" set "SALTS_UTILS_ASAN=ON"
          if not exist evidence\salts-utils mkdir evidence\salts-utils
          if errorlevel 1 exit /b 1
          set "SALTS_UTILS_EVIDENCE=%GITHUB_WORKSPACE%\evidence\salts-utils"
          cd /d "%GITHUB_WORKSPACE%\.ci-salts-utils"
          if errorlevel 1 exit /b 1
          cmake --preset "%SALTS_UTILS_PROFILE%" -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DENABLE_SANITIZER_ADDRESS=%SALTS_UTILS_ASAN% -DENABLE_SANITIZER_UNDEFINED=OFF > "%SALTS_UTILS_EVIDENCE%\configure.log" 2>&1
          if errorlevel 1 (type "%SALTS_UTILS_EVIDENCE%\configure.log" & exit /b 1)
          cmake --build --preset "%SALTS_UTILS_PROFILE%" --parallel 4 > "%SALTS_UTILS_EVIDENCE%\build.log" 2>&1
          if errorlevel 1 (type "%SALTS_UTILS_EVIDENCE%\build.log" & exit /b 1)
          if exist "%SALTS_UTILS_ROOT%" rmdir /s /q "%SALTS_UTILS_ROOT%"
          cmake --build --preset "install-%SALTS_UTILS_PROFILE%" --parallel 4 > "%SALTS_UTILS_EVIDENCE%\install.log" 2>&1
          if errorlevel 1 (type "%SALTS_UTILS_EVIDENCE%\install.log" & exit /b 1)
          cd /d "%GITHUB_WORKSPACE%"
          if errorlevel 1 exit /b 1
          if not exist "%SALTS_UTILS_ROOT%\lib\cmake\SaltsUtils\SaltsUtilsConfig.cmake" exit /b 1
          if not exist "%SALTS_UTILS_ROOT%\include\data_bind_native.h" exit /b 1
          if exist "%SALTS_UTILS_ROOT%\lib\cmake\DataBind" exit /b 1
          echo SALTS_UTILS_ROOT=%SALTS_UTILS_ROOT%>>"%GITHUB_ENV%"
          if not exist evidence\core mkdir evidence\core
          echo master>evidence\core\salts-utils-ref.txt

      - name: Use SaltsUtils master package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE "external/pkgs/salts-utils/${{ matrix.config }}"
          if (-not (Test-Path -LiteralPath (Join-Path $root 'lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake'))) {
            throw 'SaltsUtils master package is missing or incomplete'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'include/data_bind_native.h'))) {
            throw 'SaltsUtils master public headers are incomplete'
          }
          "SALTS_UTILS_ROOT=$root" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path evidence/core | Out-Null
          'master' | Set-Content -LiteralPath evidence/core/salts-utils-ref.txt -Encoding utf8NoBOM
      - name: Save SaltsUtils master package
        if: steps.salts-utils-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: external/pkgs/salts-utils/${{ matrix.config }}
          key: ${{ steps.salts-utils-package-cache.outputs.cache-primary-key }}

      # The core adapter uses the real core presets and backend dependencies.
      # Only CI machine paths change; the original backend/profile selections stay on.
      - name: Configure core preset paths for this runner
        if: (((github.ref_name == 'feat/runtime-driver-loader' || github.ref_name == 'feat/runtime-driver-cursor-adapter' || github.ref_name == 'feat/runtime-driver-command-adapter' || github.ref_name == 'feat/runtime-driver-transaction-adapter' || github.ref_name == 'feat/runtime-driver-registry-concurrency' || github.ref_name == 'feat/driver-backend-bridge' || github.ref_name == 'feat/driver-plugin-interface')) || github.ref_name == 'feat/runtime-driver-sdk-plan-view' || (github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher' || github.ref_name == 'feat/public-retained-ownership') || github.ref_name == 'refactor/orm-databind-row-publisher')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $preset = Get-Content CMakeUserPresets.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($item in $preset.configurePresets) {
            if ($item.name -in @('win-toolchain', 'linux-paths')) {
              $item.environment.PROJECT_ROOT = $env:GITHUB_WORKSPACE
              $item.environment.PKG_ROOT = "$env:GITHUB_WORKSPACE/external/pkgs"
              $item.environment.VCPKG_ROOT = $env:DRIVER_SDK_VCPKG_ROOT
            }
          }
          $preset | ConvertTo-Json -Depth 30 | Set-Content CMakeUserPresets.json -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force -Path evidence/core | Out-Null
          git diff -- CMakeUserPresets.json > evidence/core/ci-paths.diff
          if ($LASTEXITCODE -ne 0) { throw 'cannot record CI path adaptation' }
      - name: Build reflected Driver Plugin contract on Linux
        if: github.ref_name == 'feat/driver-plugin-interface' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          profile=linux-release-user
          if [[ '${{ matrix.config }}' == debug ]]; then
            profile=linux-dev-user
          fi
          mkdir -p evidence/core
          git rev-parse HEAD | tee evidence/core/plugin-contract-head.txt
          cmake --preset "$profile" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee evidence/core/plugin-contract-configure.log
          cmake --build --preset "$profile" --target orm_driver_plugin_contract_test orm_driver_plugin_header_cpp_test --parallel 4 2>&1 | tee evidence/core/plugin-contract-build.log
          ctest --preset "$profile" -R '^(orm_driver_plugin_contract|orm_driver_plugin_header_cpp)$' --verbose --no-tests=error 2>&1 | tee evidence/core/plugin-contract-ctest.log
      - name: Build reflected Driver Plugin contract on Windows
        env:
          VCPKG_DISABLE_METRICS: '1'
        if: github.ref_name == 'feat/driver-plugin-interface' && runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%DRIVER_SDK_VCPKG_ROOT%"
          set "PROFILE=win-release-user"
          if "${{ matrix.config }}"=="debug" set "PROFILE=win-dev-user"
          if not exist evidence\core mkdir evidence\core
          git rev-parse HEAD > evidence\core\plugin-contract-head.txt
          if errorlevel 1 exit /b 1
          cmake --preset "%PROFILE%" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON > evidence\core\plugin-contract-configure.log 2>&1
          if errorlevel 1 (type evidence\core\plugin-contract-configure.log & exit /b 1)
          cmake --build --preset "%PROFILE%" --target orm_driver_plugin_contract_test orm_driver_plugin_header_cpp_test --parallel 4 > evidence\core\plugin-contract-build.log 2>&1
          if errorlevel 1 (type evidence\core\plugin-contract-build.log & exit /b 1)
          ctest --preset "%PROFILE%" -R "^(orm_driver_plugin_contract|orm_driver_plugin_header_cpp)$" --verbose --no-tests=error > evidence\core\plugin-contract-ctest.log 2>&1
          if errorlevel 1 (type evidence\core\plugin-contract-ctest.log & exit /b 1)
          type evidence\core\plugin-contract-ctest.log
      - name: Build and test native plan adapter on Linux
        if: (((github.ref_name == 'feat/runtime-driver-loader' || github.ref_name == 'feat/runtime-driver-cursor-adapter' || github.ref_name == 'feat/runtime-driver-command-adapter' || github.ref_name == 'feat/runtime-driver-transaction-adapter' || github.ref_name == 'feat/runtime-driver-registry-concurrency' || github.ref_name == 'feat/driver-backend-bridge')) || github.ref_name == 'feat/runtime-driver-sdk-plan-view' || (github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher' || github.ref_name == 'feat/public-retained-ownership') || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          profile=linux-release-user
          build=build/linux-gcc-release
          if [[ '${{ matrix.config }}' == debug ]]; then
            profile=linux-dev-user
            build=build/linux-gcc-debug
          fi
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          git rev-parse HEAD | tee evidence/core/head.txt
          cmake --preset "$profile" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee evidence/core/configure.log
          cp "$build/compile_commands.json" evidence/core/compile_commands.json
          cp "$build/CMakeCache.txt" evidence/core/CMakeCache.txt
          cmake --build --preset "$profile" --target orm_postgres_flow_test orm_postgres_connection_test orm_driver_plan_view_test orm_driver_backend_bridge_test orm_driver_backend_adapter_test orm_sql_render_test orm_public_flow_test orm_cpp_flow_test orm_owner_regression_test orm_owner_state_test orm_owner_checked_test orm_owner_public_flow_test orm_owner_cpp_flow_test orm_owner_cleanup_test orm_owner_race_test orm_owner_failure_test orm_module_loader_test orm_runtime_registry_test orm_runtime_race_test --parallel 4 2>&1 | tee evidence/core/build.log
          ctest --preset "$profile" -R '^(orm_driver_plan_view|orm_driver_backend_bridge|orm_driver_backend_adapter|orm_sql_render|orm_public_flow|orm_cpp_flow|orm_postgres_flow|orm_postgres_connection|orm_module_loader|orm_runtime_registry|orm_runtime_race)$' --verbose --no-tests=error 2>&1 | tee evidence/core/ctest.log
          ctest --preset "$profile" -R '^orm_owner_(regression|state|checked|public_flow|cpp_flow|cleanup|race|failure)$' --verbose --no-tests=error 2>&1 | tee evidence/core/ownership.log
      - name: Build and test native plan adapter on Windows
        env:
          # Avoid vcpkg telemetry self-copy locking its executable during parallel launches (#50).
          VCPKG_DISABLE_METRICS: '1'
        if: (((github.ref_name == 'feat/runtime-driver-loader' || github.ref_name == 'feat/runtime-driver-cursor-adapter' || github.ref_name == 'feat/runtime-driver-command-adapter' || github.ref_name == 'feat/runtime-driver-transaction-adapter' || github.ref_name == 'feat/runtime-driver-registry-concurrency' || github.ref_name == 'feat/driver-backend-bridge')) || github.ref_name == 'feat/runtime-driver-sdk-plan-view' || (github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher' || github.ref_name == 'feat/public-retained-ownership') || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%DRIVER_SDK_VCPKG_ROOT%"
          set "ASAN_OPTIONS=halt_on_error=1"
          set "PROFILE=win-release-user"
          set "BUILD=build\Msvc-Release"
          if "${{ matrix.config }}"=="debug" set "PROFILE=win-dev-user"
          if "${{ matrix.config }}"=="debug" set "BUILD=build\Msvc"
          git rev-parse HEAD > evidence\core\head.txt
          if errorlevel 1 exit /b 1
          cmake --preset "%PROFILE%" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON > evidence\core\configure.log 2>&1
          if errorlevel 1 (type evidence\core\configure.log & exit /b 1)
          copy "%BUILD%\compile_commands.json" evidence\core\compile_commands.json
          if errorlevel 1 exit /b 1
          copy "%BUILD%\CMakeCache.txt" evidence\core\CMakeCache.txt
          if errorlevel 1 exit /b 1
          cmake --build --preset "%PROFILE%" --target orm_postgres_flow_test orm_postgres_connection_test orm_driver_plan_view_test orm_driver_backend_bridge_test orm_driver_backend_adapter_test orm_sql_render_test orm_public_flow_test orm_cpp_flow_test orm_owner_regression_test orm_owner_state_test orm_owner_checked_test orm_owner_public_flow_test orm_owner_cpp_flow_test orm_owner_cleanup_test orm_owner_race_test orm_owner_failure_test orm_module_loader_test orm_runtime_registry_test orm_runtime_race_test --parallel 4 > evidence\core\build.log 2>&1
          if errorlevel 1 (type evidence\core\build.log & exit /b 1)
          ctest --preset "%PROFILE%" -R "^(orm_driver_plan_view|orm_driver_backend_bridge|orm_driver_backend_adapter|orm_sql_render|orm_public_flow|orm_cpp_flow|orm_postgres_flow|orm_postgres_connection|orm_module_loader|orm_runtime_registry|orm_runtime_race)$" --verbose --no-tests=error > evidence\core\ctest.log 2>&1
          if errorlevel 1 (type evidence\core\ctest.log & exit /b 1)
          type evidence\core\ctest.log
          ctest --preset "%PROFILE%" -R "^orm_owner_(regression|state|checked|public_flow|cpp_flow|cleanup|race|failure)$" --verbose --no-tests=error > evidence\core\ownership.log 2>&1
          if errorlevel 1 (type evidence\core\ownership.log & exit /b 1)
          type evidence\core\ownership.log
      - name: Verify native ownership against real PostgreSQL
        if: ((github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher' || github.ref_name == 'feat/public-retained-ownership') || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Linux'
        shell: bash
        env:
          TURBODB_ORM_PGSQL_TEST_CONNINFO: host=127.0.0.1 port=${{ job.services.postgres.ports['5432'] }} dbname=orm_owner_ci user=orm_owner_ci password=orm_owner_ci_only connect_timeout=5 options='-c statement_timeout=5000'
        run: |
          set -euo pipefail
          profile=linux-release-user
          build=build/linux-gcc-release
          if [[ '${{ matrix.config }}' == debug ]]; then
            profile=linux-dev-user
            build=build/linux-gcc-debug
          fi
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          cmake --preset "$profile" -DORM_BUILD_TESTS=ON -DORM_POSTGRES_LIVE_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee evidence/core/postgres-configure.log
          cp "$build/compile_commands.json" evidence/core/postgres-compile-commands.json
          cmake --build --preset "$profile" --target orm_owner_postgres_test orm_owner_postgres_loss_test orm_postgres_live_test --parallel 4 2>&1 | tee evidence/core/postgres-build.log
          ctest --preset "$profile" -R '^(orm_owner_postgres|orm_owner_postgres_loss|orm_postgres_live)$' --verbose --no-tests=error 2>&1 | tee evidence/core/postgres-ctest.log
      # Run the entire configured root suite after the unchanged focused checks.
      # Linux keeps the live PostgreSQL service configured by the preceding step.
      - name: Build and test full root suite on Linux
        if: ((github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher' || github.ref_name == 'feat/public-retained-ownership') || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Linux'
        shell: bash
        env:
          TURBODB_ORM_PGSQL_TEST_CONNINFO: host=127.0.0.1 port=${{ job.services.postgres.ports['5432'] }} dbname=orm_owner_ci user=orm_owner_ci password=orm_owner_ci_only connect_timeout=5 options='-c statement_timeout=5000'
        run: |
          set -euo pipefail
          profile=linux-release-user
          build=build/linux-gcc-release
          if [[ '${{ matrix.config }}' == debug ]]; then
            profile=linux-dev-user
            build=build/linux-gcc-debug
          fi
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          cp "$build/CMakeCache.txt" evidence/core/full-CMakeCache.txt
          cp "$build/compile_commands.json" evidence/core/full-compile-commands.json
          ctest --preset "$profile" --show-only=json-v1 > evidence/core/full-test-inventory.json
          cmake --build --preset "$profile" --parallel 4 2>&1 | tee evidence/core/full-build.log
          ctest --preset "$profile" --verbose --no-tests=error --output-junit "$GITHUB_WORKSPACE/evidence/core/full-ctest.xml" 2>&1 | tee evidence/core/full-ctest.log
      - name: Build and test full root suite on Windows
        if: ((github.ref_name == 'feat/orm-native-ownership' || github.ref_name == 'refactor/orm-databind-row-publisher' || github.ref_name == 'feat/public-retained-ownership') || github.ref_name == 'refactor/orm-databind-row-publisher') && runner.os == 'Windows'
        env:
          VCPKG_DISABLE_METRICS: '1'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%DRIVER_SDK_VCPKG_ROOT%"
          set "ASAN_OPTIONS=halt_on_error=1"
          set "PROFILE=win-release-user"
          set "BUILD=build\Msvc-Release"
          if "${{ matrix.config }}"=="debug" set "PROFILE=win-dev-user"
          if "${{ matrix.config }}"=="debug" set "BUILD=build\Msvc"
          copy "%BUILD%\CMakeCache.txt" evidence\core\full-CMakeCache.txt
          if errorlevel 1 exit /b 1
          copy "%BUILD%\compile_commands.json" evidence\core\full-compile-commands.json
          if errorlevel 1 exit /b 1
          ctest --preset "%PROFILE%" --show-only=json-v1 > evidence\core\full-test-inventory.json
          if errorlevel 1 (type evidence\core\full-test-inventory.json & exit /b 1)
          cmake --build --preset "%PROFILE%" --parallel 4 > evidence\core\full-build.log 2>&1
          if errorlevel 1 (type evidence\core\full-build.log & exit /b 1)
          ctest --preset "%PROFILE%" --verbose --no-tests=error --output-junit "%GITHUB_WORKSPACE%\evidence\core\full-ctest.xml" > evidence\core\full-ctest.log 2>&1
          if errorlevel 1 (type evidence\core\full-ctest.log & exit /b 1)
          type evidence\core\full-ctest.log
      - name: Record runtime loader ELF evidence
        if: github.ref_name == 'feat/runtime-driver-registry-concurrency' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          build=build/linux-gcc-release
          if [[ '${{ matrix.config }}' == debug ]]; then
            build=build/linux-gcc-debug
          fi
          readelf -d "$build/bin/orm_module_loader_fixture.so" | tee evidence/core/module-loader-elf.txt
          readelf -d "$build/bin/orm_runtime_race_fixture.so" | tee evidence/core/runtime-race-module-elf.txt
          readelf -d "$build/bin/libturbo_orm.so" | tee evidence/core/runtime-core-elf.txt
          ldd "$build/bin/orm_runtime_race_fixture.so" | tee evidence/core/runtime-race-module-ldd.txt
          if grep -Eq 'FLAGS_1.*NOOPEN' evidence/core/module-loader-elf.txt evidence/core/runtime-race-module-elf.txt; then
            echo "Runtime-loadable MODULE was linked with DF_1_NOOPEN" >&2
            exit 1
          fi
      - name: Keep complete package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-package-${{ matrix.os }}-${{ matrix.config }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
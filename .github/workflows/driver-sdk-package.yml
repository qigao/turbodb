name: Published dependency contract
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: published-deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Salts 1.7.9 + SaltsUtils 4.0.1 (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Locate MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'x64 MSVC was not found' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV

      - name: Restore published native SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rid = if ('${{ runner.os }}' -eq 'Windows') { 'windows-x64' } else { 'linux-x64' }
          ./cmake/ci/restore-versioned-native-sdks.ps1 -Rid $rid

      - name: Record exact producer identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path evidence/deps | Out-Null
          @(
            'Salts.Native=1.7.9',
            'SaltsUtils.Native=4.0.1',
            'PluginABI=2',
            "SALTS_ROOT=$env:SALTS_ROOT",
            "SALTS_UTILS_ROOT=$env:SALTS_UTILS_ROOT"
          ) | Set-Content -LiteralPath evidence/deps/identity.txt -Encoding utf8NoBOM

      - name: Reject ambient dependency fallback on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          good_salts="$SALTS_ROOT"
          good_utils="$SALTS_UTILS_ROOT"
          bad="$RUNNER_TEMP/turbodb-missing-sdk"
          mkdir -p "$bad"
          export CMAKE_PREFIX_PATH="$good_salts;$good_utils"
          export SALTS_ROOT="$bad"
          export SALTS_UTILS_ROOT="$bad"
          if cmake -S tests/deps -B build/deps-negative -G Ninja >evidence/deps/ambient-negative.log 2>&1; then
            cat evidence/deps/ambient-negative.log
            echo 'dependency contract accepted ambient SDKs' >&2
            exit 1
          fi
          export SALTS_ROOT="$good_salts"
          export SALTS_UTILS_ROOT="$good_utils"

      - name: Reject ambient dependency fallback on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "GOOD_SALTS_ROOT=%SALTS_ROOT%"
          set "GOOD_SALTS_UTILS_ROOT=%SALTS_UTILS_ROOT%"
          set "CMAKE_PREFIX_PATH=%GOOD_SALTS_ROOT%;%GOOD_SALTS_UTILS_ROOT%"
          set "SALTS_ROOT=%RUNNER_TEMP%\turbodb-missing-sdk"
          set "SALTS_UTILS_ROOT=%RUNNER_TEMP%\turbodb-missing-sdk"
          if not exist "%SALTS_ROOT%" mkdir "%SALTS_ROOT%"
          cmake -S tests\deps -B build\deps-negative -G Ninja > evidence\deps\ambient-negative.log 2>&1
          if not errorlevel 1 (type evidence\deps\ambient-negative.log & echo dependency contract accepted ambient SDKs & exit /b 1)
          set "SALTS_ROOT=%GOOD_SALTS_ROOT%"
          set "SALTS_UTILS_ROOT=%GOOD_SALTS_UTILS_ROOT%"

      - name: Qualify Reflection + Plugin ABI on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          build_type=Release
          sdk_preset=sdk-linux-release
          if [[ '${{ matrix.config }}' == debug ]]; then
            build_type=Debug
            sdk_preset=sdk-linux-debug
          fi
          cmake -S tests/deps -B "build/deps-${{ matrix.config }}" -G Ninja -DCMAKE_BUILD_TYPE="$build_type" 2>&1 | tee evidence/deps/configure.log
          cmake --build "build/deps-${{ matrix.config }}" --parallel 4 2>&1 | tee evidence/deps/build.log
          ctest --test-dir "build/deps-${{ matrix.config }}" --output-on-failure 2>&1 | tee evidence/deps/ctest.log
          (cd orm/driver-sdk && cmake --preset "$sdk_preset") 2>&1 | tee evidence/deps/sdk-configure.log
          (cd orm/driver-sdk && cmake --build --preset "$sdk_preset" --parallel 4) 2>&1 | tee evidence/deps/sdk-build.log
          (cd orm/driver-sdk && ctest --preset "$sdk_preset" --output-on-failure) 2>&1 | tee evidence/deps/sdk-ctest.log

      - name: Qualify Reflection + Plugin ABI on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "BUILD_TYPE=Release"
          set "SDK_PRESET=sdk-windows-release"
          if "${{ matrix.config }}"=="debug" set "BUILD_TYPE=Debug"
          if "${{ matrix.config }}"=="debug" set "SDK_PRESET=sdk-windows-debug"
          cmake -S tests\deps -B "build\deps-${{ matrix.config }}" -G Ninja -DCMAKE_BUILD_TYPE=%BUILD_TYPE% > evidence\deps\configure.log 2>&1
          if errorlevel 1 (type evidence\deps\configure.log & exit /b 1)
          cmake --build "build\deps-${{ matrix.config }}" --parallel 4 > evidence\deps\build.log 2>&1
          if errorlevel 1 (type evidence\deps\build.log & exit /b 1)
          ctest --test-dir "build\deps-${{ matrix.config }}" --output-on-failure > evidence\deps\ctest.log 2>&1
          if errorlevel 1 (type evidence\deps\ctest.log & exit /b 1)
          cd /d "%GITHUB_WORKSPACE%\orm\driver-sdk"
          cmake --preset "%SDK_PRESET%" > "%GITHUB_WORKSPACE%\evidence\deps\sdk-configure.log" 2>&1
          if errorlevel 1 (type "%GITHUB_WORKSPACE%\evidence\deps\sdk-configure.log" & exit /b 1)
          cmake --build --preset "%SDK_PRESET%" --parallel 4 > "%GITHUB_WORKSPACE%\evidence\deps\sdk-build.log" 2>&1
          if errorlevel 1 (type "%GITHUB_WORKSPACE%\evidence\deps\sdk-build.log" & exit /b 1)
          ctest --preset "%SDK_PRESET%" --output-on-failure > "%GITHUB_WORKSPACE%\evidence\deps\sdk-ctest.log" 2>&1
          if errorlevel 1 (type "%GITHUB_WORKSPACE%\evidence\deps\sdk-ctest.log" & exit /b 1)
          cd /d "%GITHUB_WORKSPACE%"

      - name: Install Linux build prerequisite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Configure root preset paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $preset = Get-Content CMakeUserPresets.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($item in $preset.configurePresets) {
            if ($item.name -eq 'win-toolchain') {
              $item.environment.PROJECT_ROOT = $env:GITHUB_WORKSPACE
              $item.environment.PKG_ROOT = "$env:GITHUB_WORKSPACE/external/pkgs"
              $item.environment.VCPKG_ROOT = $env:VCPKG_ROOT
            }
            if ($item.name -eq 'linux-paths') {
              $item.environment.PKG_ROOT = "$env:GITHUB_WORKSPACE/external/pkgs"
              $item.environment.VCPKG_ROOT = $env:VCPKG_ROOT
            }
          }
          $preset | ConvertTo-Json -Depth 30 | Set-Content CMakeUserPresets.json -Encoding utf8NoBOM
          git diff -- CMakeUserPresets.json | Set-Content -LiteralPath evidence/deps/ci-preset-paths.diff -Encoding utf8NoBOM

      - name: Build and test TurboDB on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          profile=linux-release-user
          if [[ '${{ matrix.config }}' == debug ]]; then profile=linux-dev-user; fi
          cmake --preset "$profile" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee evidence/deps/root-configure.log
          cmake --build --preset "$profile" --parallel 4 2>&1 | tee evidence/deps/root-build.log
          ctest --preset "$profile" --output-on-failure 2>&1 | tee evidence/deps/root-ctest.log

      - name: Build and test TurboDB on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "PROFILE=win-release-user"
          if "${{ matrix.config }}"=="debug" set "PROFILE=win-dev-user"
          cmake --preset "%PROFILE%" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON > evidence\deps\root-configure.log 2>&1
          if errorlevel 1 (type evidence\deps\root-configure.log & exit /b 1)
          cmake --build --preset "%PROFILE%" --parallel 4 > evidence\deps\root-build.log 2>&1
          if errorlevel 1 (type evidence\deps\root-build.log & exit /b 1)
          ctest --preset "%PROFILE%" --output-on-failure > evidence\deps\root-ctest.log 2>&1
          if errorlevel 1 (type evidence\deps\root-ctest.log & exit /b 1)

      - name: Keep dependency qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-deps-${{ matrix.os }}-${{ matrix.config }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn

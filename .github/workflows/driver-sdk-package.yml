name: Native build and tests

on:
  pull_request:
    branches: [master]
    paths:
      - "mysql/**"
      - "redis/**"
      - "orm/**"
      - "drivers/**"
      - "dbtools/**"
      - "app/**"
      - "tidesdb/**"
      - "tools/**"
      - "cmake/**"
      - "packaging/**"
      - "presets/**"
      - "CMake*.txt"
      - "CMake*.cmake"
      - "CMake*Presets.json"
      - "vcpkg*.json"
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [master]
    paths:
      - "mysql/**"
      - "redis/**"
      - "orm/**"
      - "drivers/**"
      - "dbtools/**"
      - "app/**"
      - "tidesdb/**"
      - "tools/**"
      - "cmake/**"
      - "packaging/**"
      - "presets/**"
      - "CMake*.txt"
      - "CMake*.cmake"
      - "CMake*Presets.json"
      - "vcpkg*.json"
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: native-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mongodb-cache:
    name: MongoDB Linux vcpkg cache
    if: >-
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: publish TurboDB package')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: readwrite

      - name: Prepare MongoDB cache build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Materialize isolated MongoDB cache manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_root="$RUNNER_TEMP/turbodb-mongodb-cache-manifest"
          rm -rf "$manifest_root"
          mkdir -p "$manifest_root"
          python3 - "$GITHUB_WORKSPACE/vcpkg.json" "$manifest_root/vcpkg.json" <<'PY'
          import json, sys
          src, dst = sys.argv[1], sys.argv[2]
          data = json.load(open(src, encoding="utf-8"))
          wanted = {"mongo-c-driver", "libbson", "utf8proc"}
          out = {
              "name": "turbodb-mongodb-cache",
              "version-string": "1",
              "dependencies": ["mongo-c-driver"],
              "builtin-baseline": data["builtin-baseline"],
              "overrides": [x for x in data.get("overrides", []) if x.get("name") in wanted],
          }
          json.dump(out, open(dst, "w", encoding="utf-8"), indent=2)
          PY
          python3 -m json.tool "$manifest_root/vcpkg.json" >/dev/null
          echo "MONGODB_CACHE_MANIFEST=$manifest_root" >> "$GITHUB_ENV"

      - name: Warm MongoDB feature closure
        shell: bash
        run: |
          set -euo pipefail
          warm_root="$RUNNER_TEMP/turbodb-mongodb-vcpkg-warm"
          rm -rf "$warm_root"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$MONGODB_CACHE_MANIFEST" \
            --x-install-root="$warm_root" \
            --triplet x64-linux

      - name: Verify MongoDB feature from shared cache only
        shell: bash
        run: |
          set -euo pipefail
          verify_root="$RUNNER_TEMP/turbodb-mongodb-vcpkg-verify"
          rm -rf "$verify_root" "$VCPKG_BINARY_CACHE"
          mkdir -p "$VCPKG_BINARY_CACHE"
          for attempt in 1 2 3 4; do
            rm -rf "$verify_root"
            if "$VCPKG_ROOT/vcpkg" install \
              --x-manifest-root="$MONGODB_CACHE_MANIFEST" \
              --x-install-root="$verify_root" \
              --triplet x64-linux \
              --only-binarycaching; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 15)); fi
          done
          echo "MongoDB feature was not published to shared cache" >&2
          exit 1

  studio-shell:
    name: TurboDB Studio WTL shell (windows-x64)
    if: >-
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: publish TurboDB package')
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-native
        with:
          platform: windows-x64-studio

      - name: Locate MSVC and install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'x64 MSVC was not found' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
          choco install ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Ninja install failed' }

      - name: Install published native SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid windows-x64

      - name: Configure and build Studio shell
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --preset ci-windows-release -DTURBODB_BUILD_APP=ON -DTURBODB_BUILD_DBTOOLS=OFF -DBUILD_TESTS=OFF -DBUILD_E2E_TESTS=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset ci-windows-release --target turbodb-studio --parallel 4
          if errorlevel 1 exit /b 1

  native:
    needs: mongodb-cache
    if: >-
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: publish TurboDB package')
    uses: ./.github/workflows/native-sdk.yml

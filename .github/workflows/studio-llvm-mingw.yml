name: TurboDB Studio llvm-mingw native Windows

on:
  pull_request:
    paths:
      - 'app/**'
      - 'CMakeLists.txt'
      - 'CMakeOptions.cmake'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/workflows/studio-llvm-mingw.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turbodb-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-llvm-mingw:
    name: Original OpenATL/WTL + Studio llvm-mingw x64 native
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: ddb500fb7c1472107efbd79ea92d7552cb01f452
          path: tools/vcpkg-cache
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Bootstrap canonical curl-only vcpkg-cache
        shell: pwsh
        run: |
          python tools/vcpkg-cache/scripts/setup-vcpkg-curl-cache.py tools/vcpkg-cache
          if ($LASTEXITCODE -ne 0) { throw 'Pinned vcpkg bootstrap failed' }
      - name: Obtain pinned llvm-mingw x64 UCRT
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          & curl.exe -fLsS --retry 2 --output llvm-mingw.zip $url
          if ($LASTEXITCODE -ne 0) { throw 'llvm-mingw download failed' }
          $sum=(Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sum -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw "llvm-mingw archive SHA256 mismatch: $sum"
          }
          Expand-Archive llvm-mingw.zip -DestinationPath tools/llvm -Force
          $tool=Get-ChildItem tools/llvm -Recurse -Filter x86_64-w64-mingw32-clang++.exe |
            Select-Object -First 1
          if (!$tool) { throw 'Pinned llvm-mingw compiler not found' }
          "TURBODB_LLVM_MINGW_BIN=$($tool.Directory.FullName)" >> $env:GITHUB_ENV
          $tool.Directory.FullName >> $env:GITHUB_PATH
          & $tool.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'llvm-mingw compiler cannot execute' }
      - name: Checkout exact Salts 2.3 source matching published ABI
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 6d6fd387cb245be8d7b0d866f9babad026a26832
          path: external/studio-salts-src
          persist-credentials: false
      - name: Checkout exact SaltsUtils 4.3 source matching published ABI
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: fbb5f3ee19589836ced0f3b98414e71e6dcc1388
          path: external/studio-salts-utils-src
          persist-credentials: false
      - name: Restore host re2c only, without incompatible MSVC SDK archives
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./cmake/ci/restore-native-sdks.ps1 -Rid windows-x64 -HostToolsOnly
          if ($LASTEXITCODE -ne 0) { throw 'Host re2c restore failed' }
      - name: Compile source-only Salts and SaltsUtils using Studio llvm-mingw
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installed=Join-Path $env:GITHUB_WORKSPACE 'build/studio-vcpkg-installed'
          $triplets=Join-Path $env:GITHUB_WORKSPACE 'app/vcpkg-triplets'
          $zstd=Join-Path $env:GITHUB_WORKSPACE 'tools/vcpkg-cache/ports/zstd'
          $saltsPrefix=Join-Path $env:GITHUB_WORKSPACE 'build/studio-sdk/salts'
          $utilsPrefix=Join-Path $env:GITHUB_WORKSPACE 'build/studio-sdk/salts-utils'
          $env:PATH="$env:TURBODB_LLVM_MINGW_BIN;$env:RE2C_ROOT/bin;$installed/x64-llvm-mingw-dynamic/bin;$env:PATH"
          $common=@(
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            '-DCMAKE_BUILD_TYPE=Release'
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
            "-DVCPKG_INSTALLED_DIR=$installed"
            '-DVCPKG_TARGET_TRIPLET=x64-llvm-mingw-dynamic'
            '-DVCPKG_HOST_TRIPLET=x64-windows'
            "-DVCPKG_OVERLAY_TRIPLETS=$triplets"
            "-DVCPKG_OVERLAY_PORTS=$zstd"
            '-DBUILD_TESTS=OFF'
            '-DBUILD_EXAMPLES=OFF'
            '-DBUILD_BENCHMARKS=OFF'
            '-DENABLE_TESTS=OFF'
            '-DENABLE_ASAN=OFF'
          )
          $releases=@(
            @{ source='external/studio-salts-src'; build='build/studio-salts-llvm'; prefix=$saltsPrefix; config='Salts/SaltsConfig.cmake'; name='Salts'; commit='6d6fd387cb245be8d7b0d866f9babad026a26832' }
            @{ source='external/studio-salts-utils-src'; build='build/studio-salts-utils-llvm'; prefix=$utilsPrefix; config='SaltsUtils/SaltsUtilsConfig.cmake'; name='SaltsUtils'; commit='fbb5f3ee19589836ced0f3b98414e71e6dcc1388' }
          )
          foreach ($item in $releases) {
            $realSource=(Resolve-Path $item.source).Path
            $actualCommit=(& git -C $realSource rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualCommit -ne $item.commit) {
              throw "Unexpected pinned $($item.name) source HEAD: $actualCommit"
            }
            if ($item.name -eq 'Salts') {
              # The old immutable 2.3 release used _MSC_VER for Windows'
              # aligned-allocation ownership path. llvm-mingw must use the
              # same Windows _aligned_malloc/_aligned_free pair, never POSIX.
              & ./cmake/ci/studio-salts-llvm-mingw-compat.ps1 -SourceRoot $realSource -ExpectedHead $item.commit
            }
            if ($item.name -eq 'SaltsUtils') {
              # SaltsUtils must consume the same locally compiled Salts SDK.
              $env:SALTS_ROOT=$saltsPrefix
              $env:PATH="$saltsPrefix/bin;$env:PATH"
              $settings=@('-DSALTS_UTILS_ENABLE_CAPTURE=OFF')
            } else {
              $settings=@()
            }
            & cmake -S $item.source -B $item.build -G Ninja @common @settings "-DCMAKE_INSTALL_PREFIX=$($item.prefix)"
            if ($LASTEXITCODE -ne 0) { throw "$($item.name) llvm-mingw configure failed" }
            # CMake may select the "cc.exe" wrapper inside llvm-mingw/bin
            # rather than the x86_64-prefixed clang.exe spelling. Validate
            # the executable's provenance and actual target, not its basename.
            $cache=Get-Content (Join-Path $item.build 'CMakeCache.txt')
            $compilerEntry=@($cache | Where-Object {
              $_ -match '^CMAKE_C_COMPILER:(?:FILEPATH|STRING|UNINITIALIZED)='
            })
            $tripletEntry=@($cache | Where-Object {
              $_ -match '^VCPKG_TARGET_TRIPLET:(?:STRING|UNINITIALIZED|INTERNAL)='
            })
            if ($compilerEntry.Count -ne 1 -or $tripletEntry.Count -ne 1) {
              throw "$($item.name) CMake cache lacks unique compiler/target entries"
            }
            $cc=($compilerEntry[0] -split '=',2)[1]
            $selectedTriplet=($tripletEntry[0] -split '=',2)[1]
            Write-Host "SDK_ABI_SELECTION component=$($item.name) compiler=$cc triplet=$selectedTriplet"
            $ccPath=[IO.Path]::GetFullPath($cc)
            $expectedBin=[IO.Path]::GetFullPath($env:TURBODB_LLVM_MINGW_BIN).TrimEnd([char[]]@([IO.Path]::DirectorySeparatorChar,[IO.Path]::AltDirectorySeparatorChar))
            $expectedPrefix=$expectedBin+[IO.Path]::DirectorySeparatorChar
            if (-not $ccPath.StartsWith($expectedPrefix,[StringComparison]::OrdinalIgnoreCase) -or
                $selectedTriplet -ne 'x64-llvm-mingw-dynamic') {
              throw "$($item.name) selected a compiler outside pinned llvm-mingw or wrong vcpkg triplet"
            }
            $compilerVersion=(& $cc --version | Out-String)
            if ($LASTEXITCODE -ne 0 -or $compilerVersion -notmatch '(?i)clang version 23[.]') {
              throw "$($item.name) compiler is not pinned LLVM Clang 23"
            }
            $compilerTarget=(& $cc -dumpmachine | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or
                $compilerTarget -notmatch '^x86_64-.*(?:mingw|windows-gnu)') {
              throw "$($item.name) compiler has wrong native Windows x64 target: $compilerTarget"
            }
            Write-Host "STUDIO_NATIVE_COMPILER_ADMITTED component=$($item.name) target=$compilerTarget"
            & cmake --build $item.build --target install --parallel 4
            if ($LASTEXITCODE -ne 0) { throw "$($item.name) native source build/install failed" }
            $configPath=Join-Path $item.prefix ("lib/cmake/"+$item.config)
            if (-not (Test-Path $configPath -PathType Leaf)) { throw "Missing $($item.name) installed config: $configPath" }
            $badMsvcLibs=@(Get-ChildItem (Join-Path $item.prefix 'lib') -Filter '*.lib' -File -Recurse -ErrorAction Stop)
            $nativeLibs=@(Get-ChildItem (Join-Path $item.prefix 'lib') -Filter '*.a' -File -Recurse -ErrorAction Stop)
            if ($badMsvcLibs.Count -ne 0 -or $nativeLibs.Count -eq 0) {
              throw "$($item.name) SDK mixes MSVC archives or contains no llvm-mingw archives"
            }
            Write-Host "STUDIO_NATIVE_SDK_READY component=$($item.name) source=$actualCommit triplet=x64-llvm-mingw-dynamic archives=$($nativeLibs.Count)"
          }
          "SALTS_ROOT=$saltsPrefix" >> $env:GITHUB_ENV
          "SALTS_UTILS_ROOT=$utilsPrefix" >> $env:GITHUB_ENV
          $provenance=@(
            'target=x86_64-w64-mingw32'
            'toolchain=llvm-mingw-20261020-ucrt'
            'triplet=x64-llvm-mingw-dynamic'
            'salts_source=6d6fd387cb245be8d7b0d866f9babad026a26832'
            'salts_utils_source=fbb5f3ee19589836ced0f3b98414e71e6dcc1388'
            'native_archives=required'
            'msvc_archives=forbidden'
          )
          $proof=Join-Path $env:GITHUB_WORKSPACE 'build/studio-sdk/source-abi.txt'
          $provenance | Set-Content -LiteralPath $proof -Encoding utf8NoBOM
      - name: Configure complete Studio/ORM Windows graph with llvm-mingw
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PATH="$env:TURBODB_LLVM_MINGW_BIN;$env:RE2C_ROOT/bin;$env:SALTS_ROOT/bin;$env:SALTS_UTILS_ROOT/bin;$env:PATH"
          $installed=Join-Path $env:GITHUB_WORKSPACE 'build/studio-vcpkg-installed'
          $triplets=Join-Path $env:GITHUB_WORKSPACE 'app/vcpkg-triplets'
          $wtl=Join-Path $env:GITHUB_WORKSPACE 'tools/vcpkg-cache/ports/wtl'
          $zstd=Join-Path $env:GITHUB_WORKSPACE 'tools/vcpkg-cache/ports/zstd'
          & cmake -S . -B build/studio-llvm -G Ninja `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            '-DCMAKE_BUILD_TYPE=Release' `
            "-DVCPKG_INSTALLED_DIR=$installed" `
            '-DVCPKG_TARGET_TRIPLET=x64-llvm-mingw-dynamic' `
            '-DVCPKG_HOST_TRIPLET=x64-windows' `
            "-DVCPKG_OVERLAY_TRIPLETS=$triplets" `
            "-DTURBODB_WTL_PORT_DIR=$wtl" `
            "-DTURBODB_ZSTD_PORT_DIR=$zstd" `
            '-DTURBODB_BUILD_APP=ON' '-DTURBODB_BUILD_ORM=ON' `
            '-DTURBODB_BUILD_DBTOOLS=OFF' '-DTURBODB_BUILD_REDIS=OFF' `
            '-DTURBODB_BUILD_SQLPARSER=OFF' '-DTURBODB_BUILD_TIDESSQL=OFF' `
            '-DTURBODB_BUILD_TIDESSQL_SERVER=OFF' '-DBUILD_EXAMPLES=OFF' `
            '-DBUILD_TESTS=ON' '-DBUILD_E2E_TESTS=OFF'
          if ($LASTEXITCODE -ne 0) {
            $detector=Join-Path $env:VCPKG_ROOT 'buildtrees/detect_compiler'
            if (Test-Path $detector) {
              Get-ChildItem $detector -File -Recurse |
                Where-Object { $_.Name -like '*-out.log' } |
                Select-Object -Last 12 | ForEach-Object {
                  Write-Host "=== vcpkg compiler detector: $($_.FullName) ==="
                  Get-Content -LiteralPath $_.FullName -Tail 100
                }
            }
            throw 'llvm-mingw Studio configure failed (see compiler detector logs)'
          }
          $cache=Get-Content build/studio-llvm/CMakeCache.txt
          if ($cache -notcontains 'TURBODB_BUILD_APP:BOOL=ON' -or
              !($cache -match '^VCPKG_TARGET_TRIPLET:(?:STRING|UNINITIALIZED)=x64-llvm-mingw-dynamic$')) {
            throw 'Studio or target ABI was dropped during configure'
          }
      - name: Build entire configured Studio and ORM graph
        id: full_build
        shell: pwsh
        run: |
          $env:PATH="$env:TURBODB_LLVM_MINGW_BIN;$env:RE2C_ROOT/bin;$env:SALTS_ROOT/bin;$env:SALTS_UTILS_ROOT/bin;$env:PATH"
          cmake --build build/studio-llvm --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'llvm-mingw Studio full build failed' }
      - name: Run real native Windows Studio CTest
        id: native_ctest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin=Join-Path $env:GITHUB_WORKSPACE 'build/studio-llvm/bin'
          $installed=Join-Path $env:GITHUB_WORKSPACE 'build/studio-vcpkg-installed/x64-llvm-mingw-dynamic/bin'
          $env:PATH="$bin;$installed;$env:TURBODB_LLVM_MINGW_BIN;$env:SALTS_ROOT/bin;$env:SALTS_UTILS_ROOT/bin;$env:PATH"
          # A TinyTest executable may exit 0 despite having zero registered
          # specs. Prove real Clang/MinGW C constructor registration by listing
          # a known existing ORM test suite before executing its CTest.
          $maintenance=Join-Path $bin 'orm_sqlite_plugin_maintenance_test.exe'
          if (-not (Test-Path $maintenance -PathType Leaf)) {
            throw 'Real ORM TinyTest maintenance executable missing'
          }
          $listed=(& $maintenance --list | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              -not $listed.Contains('SQLite plugin maintenance checkpoint and restore')) {
            throw "Clang/MinGW TinyTest registration did not execute: $listed"
          }
          Write-Host 'STUDIO_TINYTEST_RUNTIME_REGISTRATION_OK'
          ctest --test-dir build/studio-llvm --output-on-failure -R '^orm_sqlite_plugin_maintenance$'
          if ($LASTEXITCODE -ne 0) { throw 'Native ORM TinyTest maintenance test failed' }
          ctest --test-dir build/studio-llvm --output-on-failure -R '^turbodb-app-' --repeat until-fail:3
          if ($LASTEXITCODE -ne 0) { throw 'Native Studio application tests failed' }
      - name: Admit real PE and editor DLL closure
        # Run cheap independent PE evidence even when a native app test is RED.
        # The job and final acceptance remain RED until native CTest passes.
        if: ${{ !cancelled() && steps.full_build.outcome == 'success' }}
        id: pe_closure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($name in @('TurboDBStudio.exe','Scintilla.dll','Lexilla.dll')) {
            $path=Join-Path 'build/studio-llvm/bin' $name
            if (!(Test-Path $path -PathType Leaf)) {
              throw "Missing real Windows Studio payload $name"
            }
          }
          $machine=Get-ChildItem $env:TURBODB_LLVM_MINGW_BIN -Filter llvm-readobj.exe |
            Select-Object -First 1
          if (!$machine) { throw 'Pinned PE tool llvm-readobj.exe is missing' }
          foreach ($name in @('TurboDBStudio.exe','Scintilla.dll','Lexilla.dll')) {
            $path=Join-Path 'build/studio-llvm/bin' $name
            $pe=& $machine.FullName --file-headers $path | Out-String
            if ($LASTEXITCODE -ne 0 -or $pe -notmatch 'IMAGE_FILE_MACHINE_AMD64') {
              throw "Studio PE machine does not match x64 llvm-mingw: $name"
            }
          }
          # The editor DLLs are explicit LoadLibraryW seeds. A static import
          # table entry would prove an accidental import-lib / ABI dependency.
          $imports=& $machine.FullName --coff-imports 'build/studio-llvm/bin/TurboDBStudio.exe' | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect Studio PE imports' }
          if ($imports -match '(?i)(?:Scintilla|Lexilla)[.]dll') {
            throw 'Studio must load editor DLLs explicitly, never link import libs'
          }
          Write-Host "STUDIO_PE_EDITOR_DLL_STRUCTURE_OK arch=x64 exe=1 scintilla=1 lexilla=1 dynamic_editor=1"
      - name: Admit complete Studio qualification on exact HEAD
        if: ${{ success() && steps.full_build.outcome == 'success' && steps.native_ctest.outcome == 'success' && steps.pe_closure.outcome == 'success' }}
        shell: pwsh
        run: Write-Host "TURBODB_STUDIO_LLVM_MINGW_OK arch=x64 exe=1 scintilla=1 lexilla=1 native_ctest=1 dynamic_editor=1"
      - uses: actions/upload-artifact@v4
        with:
          name: turbodb-studio-llvm-mingw-x64-qualification
          path: |
            build/studio-llvm/bin/
            build/studio-sdk/source-abi.txt
          if-no-files-found: error

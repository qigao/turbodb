name: MySQL Driver live contract

on:
  pull_request:
    branches: [master]
    paths:
      - "mysql/**"
      - "drivers/mysql/**"
      - "orm/tests/e2e/mysql/**"
      - "dbtools/mysql/**"
      - "dbtools/tests/mysql/**"
      - "dbtools/CMakeLists.txt"
      - "dbtools/src/**"
      - "dbtools/tests/CMakeLists.txt"
      - "orm/include/**"
      - "orm/src/**"
      - "orm/CMakeLists.txt"
      - "orm/tests/CMakeLists.txt"
      - "orm/tests/e2e/CMakeLists.txt"
      - "orm/tests/support/**"
      - "drivers/CMakeLists.txt"
      - "drivers/schema/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMake*Presets.json"
      - "presets/**"
      - "cmake/**"
      - ".github/actions/**"
      - "vcpkg*.json"
      - ".github/workflows/mysql-driver-live.yml"
  push:
    branches: [master]
    paths:
      - "mysql/**"
      - "drivers/mysql/**"
      - "orm/tests/e2e/mysql/**"
      - "dbtools/mysql/**"
      - "dbtools/tests/mysql/**"
      - "dbtools/CMakeLists.txt"
      - "dbtools/src/**"
      - "dbtools/tests/CMakeLists.txt"
      - "orm/include/**"
      - "orm/src/**"
      - "orm/CMakeLists.txt"
      - "orm/tests/CMakeLists.txt"
      - "orm/tests/e2e/CMakeLists.txt"
      - "orm/tests/support/**"
      - "drivers/CMakeLists.txt"
      - "drivers/schema/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMake*Presets.json"
      - "presets/**"
      - "cmake/**"
      - ".github/actions/**"
      - "vcpkg*.json"
      - ".github/workflows/mysql-driver-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mysql-driver-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-cnet-live:
    name: MySQL 8.0.40 CNet TLS/auth/ping
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: turbodb
          MYSQL_USER: turbodb
          MYSQL_PASSWORD: turbodbpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout exact TurboDB head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-native

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Restore published Salts SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64

      - name: Prepare MySQL auth users and TLS fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mysql-tls" "$GITHUB_WORKSPACE/evidence/mysql"
          cid="$(docker ps --filter ancestor=mysql:8.0.40 --format '{{.ID}}' | head -n 1)"
          test -n "$cid"

          docker exec "$cid" mysql -uroot -prootpw -e \
            "CREATE DATABASE IF NOT EXISTS turbodb_b; CREATE USER IF NOT EXISTS 'nativeuser'@'%' IDENTIFIED WITH mysql_native_password BY 'nativepass'; GRANT ALL ON turbodb.* TO 'nativeuser'@'%'; GRANT ALL ON turbodb_b.* TO 'turbodb'@'%'; GRANT ALL ON turbodb_b.* TO 'nativeuser'@'%'; FLUSH PRIVILEGES;"

          docker exec "$cid" mysql -uroot -prootpw -e \
            "DROP TABLE IF EXISTS turbodb.m3_probe; CREATE TABLE turbodb.m3_probe(s BIGINT NOT NULL, u BIGINT UNSIGNED NOT NULL, txt VARCHAR(32) NOT NULL, decv DECIMAL(10,2) NOT NULL); INSERT INTO turbodb.m3_probe VALUES (-42,18446744073709551615,'hello',123.45); DROP TABLE IF EXISTS turbodb.m4_command; CREATE TABLE turbodb.m4_command(s BIGINT NOT NULL PRIMARY KEY, txt VARCHAR(64) NOT NULL); INSERT INTO turbodb.m4_command VALUES (-7,'seed'); DROP TABLE IF EXISTS turbodb.m4_txn; CREATE TABLE turbodb.m4_txn(s BIGINT NOT NULL PRIMARY KEY, txt VARCHAR(64) NOT NULL); INSERT INTO turbodb.m4_txn VALUES (-9,'seed'); DROP TABLE IF EXISTS turbodb.m4_commit_unknown; CREATE TABLE turbodb.m4_commit_unknown(s BIGINT NOT NULL PRIMARY KEY, n BIGINT NOT NULL); INSERT INTO turbodb.m4_commit_unknown VALUES (-11,0); DROP TABLE IF EXISTS turbodb.m4_driver; CREATE TABLE turbodb.m4_driver(s BIGINT NOT NULL PRIMARY KEY, n BIGINT NOT NULL); INSERT INTO turbodb.m4_driver VALUES (-13,0); DROP TABLE IF EXISTS turbodb_b.m4_driver; CREATE TABLE turbodb_b.m4_driver(s BIGINT NOT NULL PRIMARY KEY, n BIGINT NOT NULL); INSERT INTO turbodb_b.m4_driver VALUES (-13,100); DROP TABLE IF EXISTS turbodb.structured_items; CREATE TABLE turbodb.structured_items(id BIGINT NOT NULL PRIMARY KEY, s BIGINT NOT NULL, note VARCHAR(32) NULL); DROP TABLE IF EXISTS turbodb_b.structured_items; CREATE TABLE turbodb_b.structured_items(id BIGINT NOT NULL PRIMARY KEY, s BIGINT NOT NULL, note VARCHAR(32) NULL); DROP TABLE IF EXISTS turbodb.m5_values; CREATE TABLE turbodb.m5_values(id BIGINT NOT NULL PRIMARY KEY, n_null BIGINT NULL, u BIGINT UNSIGNED NOT NULL, b BLOB NOT NULL, decv DECIMAL(20,6) NOT NULL, d DATE NOT NULL, t TIME(6) NOT NULL, dt DATETIME(6) NOT NULL); INSERT INTO turbodb.m5_values VALUES (1,NULL,18446744073709551615,X'007FFF',1234567890123.456789,'2026-09-28','12:34:56.123456','2026-09-28 12:34:56.654321'); DROP TABLE IF EXISTS turbodb.m5_constraint; CREATE TABLE turbodb.m5_constraint(id BIGINT NOT NULL PRIMARY KEY, note VARCHAR(32) NOT NULL); INSERT INTO turbodb.m5_constraint VALUES (1,'seed'); DROP TABLE IF EXISTS turbodb.m5_disconnect; CREATE TABLE turbodb.m5_disconnect(id BIGINT NOT NULL PRIMARY KEY, n BIGINT NOT NULL); INSERT INTO turbodb.m5_disconnect VALUES (1,0);"
          docker exec "$cid" mysql -uroot -prootpw -Nse \
            "SELECT VERSION(); SELECT user,host,plugin FROM mysql.user WHERE user IN ('turbodb','nativeuser') ORDER BY user,host;" \
            | tee "$GITHUB_WORKSPACE/evidence/mysql/server.txt"

          docker cp "$cid:/var/lib/mysql/ca.pem" "$RUNNER_TEMP/mysql-tls/ca.pem"
          docker cp "$cid:/var/lib/mysql/ca-key.pem" "$RUNNER_TEMP/mysql-tls/ca-key.pem"

          # MySQL's auto-generated server certificate has only a CN and no SAN.
          # GmSSL intentionally requires DNS SubjectAltName for hostname verification,
          # so issue a focused localhost server certificate from the container CA.
          openssl genrsa -out "$RUNNER_TEMP/mysql-tls/server-key.pem" 2048
          openssl req -new \
            -key "$RUNNER_TEMP/mysql-tls/server-key.pem" \
            -subj "/CN=localhost" \
            -out "$RUNNER_TEMP/mysql-tls/server.csr"
          cat > "$RUNNER_TEMP/mysql-tls/server-ext.cnf" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost
          authorityKeyIdentifier=keyid,issuer
          subjectKeyIdentifier=hash
          EOF
          openssl x509 -req \
            -in "$RUNNER_TEMP/mysql-tls/server.csr" \
            -CA "$RUNNER_TEMP/mysql-tls/ca.pem" \
            -CAkey "$RUNNER_TEMP/mysql-tls/ca-key.pem" \
            -CAcreateserial \
            -days 1 \
            -sha256 \
            -extfile "$RUNNER_TEMP/mysql-tls/server-ext.cnf" \
            -out "$RUNNER_TEMP/mysql-tls/server-cert.pem"

          docker cp "$RUNNER_TEMP/mysql-tls/server-key.pem" "$cid:/var/lib/mysql/server-key.pem"
          docker cp "$RUNNER_TEMP/mysql-tls/server-cert.pem" "$cid:/var/lib/mysql/server-cert.pem"
          docker exec "$cid" sh -lc \
            "chown mysql:mysql /var/lib/mysql/server-key.pem /var/lib/mysql/server-cert.pem && chmod 600 /var/lib/mysql/server-key.pem && chmod 644 /var/lib/mysql/server-cert.pem"
          docker exec "$cid" mysql -uroot -prootpw -e "ALTER INSTANCE RELOAD TLS;"

          cp "$RUNNER_TEMP/mysql-tls/ca.pem" "$GITHUB_WORKSPACE/evidence/mysql/ca.pem"
          cp "$RUNNER_TEMP/mysql-tls/server-cert.pem" "$GITHUB_WORKSPACE/evidence/mysql/server-cert.pem"
          subject="$(openssl x509 -in "$RUNNER_TEMP/mysql-tls/server-cert.pem" \
            -noout -subject -nameopt RFC2253)"
          san="$(openssl x509 -in "$RUNNER_TEMP/mysql-tls/server-cert.pem" \
            -noout -ext subjectAltName)"
          server_name="localhost"
          grep -F "DNS:localhost" <<<"$san"
          printf 'certificate_subject=%s\n%s\nserver_name=%s\n' "$subject" "$san" "$server_name" \
            | tee "$GITHUB_WORKSPACE/evidence/mysql/tls.txt"

          {
            echo "ORM_MYSQL_HOST=127.0.0.1"
            echo "ORM_MYSQL_PORT=3306"
            echo "ORM_MYSQL_USER=turbodb"
            echo "ORM_MYSQL_PASSWORD=turbodbpass"
            echo "ORM_MYSQL_DATABASE=turbodb"
            echo "ORM_MYSQL_DATABASE_B=turbodb_b"
            echo "ORM_MYSQL_CA_FILE=$RUNNER_TEMP/mysql-tls/ca.pem"
            echo "ORM_MYSQL_SERVER_NAME=$server_name"
          } >> "$GITHUB_ENV"

      - name: Build and run MySQL live tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-e2e
          cmake --build --preset ci-linux-e2e --target orm_mysql_driver_live_test orm_mysql_live_test dbtool_mysql_live_test --parallel 4
          export TURBODB_DBTOOLS_MYSQL_TEST_CONNINFO
          TURBODB_DBTOOLS_MYSQL_TEST_CONNINFO="$(python3 -c 'import json,os; print(json.dumps({"host":os.environ["ORM_MYSQL_HOST"],"port":int(os.environ["ORM_MYSQL_PORT"]),"username":os.environ["ORM_MYSQL_USER"],"password":os.environ["ORM_MYSQL_PASSWORD"],"database":os.environ["ORM_MYSQL_DATABASE"],"ca_file":os.environ["ORM_MYSQL_CA_FILE"],"server_name":os.environ["ORM_MYSQL_SERVER_NAME"]}))')"
          ctest --preset ci-linux-e2e -R '^(orm_mysql_(driver_live|live)|dbtool_mysql_live_test)$' --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/evidence/mysql/tests.xml"

      - name: Test mysql_native_password authentication
        shell: bash
        env:
          ORM_MYSQL_USER: nativeuser
          ORM_MYSQL_PASSWORD: nativepass
        run: |
          ctest --preset ci-linux-e2e -R '^orm_mysql_live$' --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/evidence/mysql/native-auth.xml"

      - name: Keep MySQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-cnet-live-${{ github.sha }}
          path: evidence/mysql/
          if-no-files-found: warn

name: MySQL Driver live contract

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mysql-driver-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-live:
    name: MySQL 8.0.40 live Driver CRUD
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_DATABASE: turbodb_test
          MYSQL_USER: turbodb
          MYSQL_PASSWORD: turbodb
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout exact TurboDB head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore canonical re2c host tool
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
        with:
          version: "4.6.3"

      - name: Restore published native SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-versioned-native-sdks.ps1 -Rid linux-x64

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build

      - name: Build and run MySQL live Driver contract
        shell: bash
        env:
          ORM_MYSQL_HOST: 127.0.0.1
          ORM_MYSQL_USER: turbodb
          ORM_MYSQL_PASSWORD: turbodb
          ORM_MYSQL_DATABASE: turbodb_test
          ORM_MYSQL_PORT: "3306"
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/mysql-driver-live"
          cmake -S "$GITHUB_WORKSPACE" -B "$build" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE"             -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed_mysql"             -DVCPKG_TARGET_TRIPLET=x64-linux             -DORM_WITH_SQLITE=OFF             -DORM_WITH_PGSQL=OFF             -DORM_BUILD_REDIS_DRIVER=OFF             -DORM_BUILD_MONGODB_DRIVER=OFF             -DORM_BUILD_TIDESDB_DRIVER=OFF             -DORM_BUILD_MYSQL_DRIVER=ON             -DORM_MYSQL_LIVE_TESTS=ON             -DORM_BUILD_TESTS=ON             -DTURBODB_BUILD_REDIS=OFF             -DTURBODB_BUILD_DBTOOLS=OFF             -DTURBODB_DBTOOLS_WITH_SQLITE=OFF             -DTURBODB_DBTOOLS_WITH_PGSQL=OFF             -DBUILD_TESTS=OFF             -DENABLE_TESTS=OFF
          cmake --build "$build" --target orm_mysql_live_driver_test orm_mysql_sql_test --parallel 4

          mkdir -p evidence/mysql-live
          {
            echo "head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "MySQL=8.0.40"
            echo "libmysql=8.0.40"
            echo "Salts.Native=1.8.0"
            echo "SaltsUtils.Native=4.1.0"
            echo "PluginABI=2"
          } > evidence/mysql-live/qualification.txt

          ctest --test-dir "$build"             -R '^(orm_mysql_sql|orm_mysql_live_driver)$'             --output-on-failure 2>&1 | tee evidence/mysql-live/ctest.log

          core="$build/bin/libturbo_orm.so"
          driver="$build/bin/turbodb_driver_mysql.so"
          readelf -d "$core" > evidence/mysql-live/core-dependencies.txt
          readelf -d "$driver" > evidence/mysql-live/driver-dependencies.txt
          nm --defined-only "$driver" > evidence/mysql-live/driver-symbols.txt
          nm -D --defined-only "$driver" > evidence/mysql-live/driver-exports.txt

          if grep -Eiq 'mysqlclient|libmysql' evidence/mysql-live/core-dependencies.txt; then
            cat evidence/mysql-live/core-dependencies.txt
            echo 'generic core imports MySQL native libraries' >&2
            exit 1
          fi

          if ! grep -Eiq 'mysqlclient|libmysql' evidence/mysql-live/driver-dependencies.txt; then
            if ! grep -Eq '[[:space:]][Tt][[:space:]]mysql_stmt_prepare$' evidence/mysql-live/driver-symbols.txt; then
              cat evidence/mysql-live/driver-dependencies.txt
              grep -E 'mysql_stmt_prepare|mysql_real_connect' evidence/mysql-live/driver-symbols.txt || true
              echo 'MySQL Driver contains neither shared nor static libmysql implementation' >&2
              exit 1
            fi
          fi

          grep -Eq '[[:space:]]salts_plugin_query$' evidence/mysql-live/driver-exports.txt
          if grep -Eiq '[[:space:]]mysql_[A-Za-z0-9_]*$' evidence/mysql-live/driver-exports.txt; then
            cat evidence/mysql-live/driver-exports.txt
            echo 'libmysql symbols leaked from Driver MODULE' >&2
            exit 1
          fi

          sha256sum "$core" "$driver" > evidence/mysql-live/binaries.sha256

      - name: Keep MySQL live qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-driver-live-${{ github.sha }}
          path: evidence/mysql-live/
          if-no-files-found: warn

name: Build native SDK

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ci
      tidessql-tests:
        description: Run the independent TidesSQL suite instead of ORM tests and SDK staging
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  sdk:
    name: ${{ inputs.tidessql-tests && 'TidesSQL' || 'ORM + drivers' }} (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TURBODB_TEST_PRESET: ${{ inputs.tidessql-tests && format('{0}-tidessql', matrix.preset) || matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64, host: linux-x64, preset: ci-linux-release}
          - {os: ubuntu-24.04-arm, rid: linux-arm64, host: linux-arm64, preset: ci-linux-arm64-release}
          - {os: macos-15, rid: macos-arm64, host: macos-arm64, preset: ci-macos-arm64-release}
          - {os: windows-2025, rid: windows-x64, host: windows-x64, preset: ci-windows-release}
          - {os: ubuntu-24.04, rid: android-arm64-v8a, host: linux-x64, preset: ci-android-release}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
        with:
          platform: ${{ matrix.rid }}
      - name: Install Linux host tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build gdb
      - name: Install macOS host tools
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install autoconf ninja gcc@15
          if [[ '${{ inputs.tidessql-tests }}' == true ]]; then
            brew install maven
          fi
          echo "$(brew --prefix gcc@15)/bin" >> "$GITHUB_PATH"
      - name: Build bundled Lemon host tool
        if: matrix.rid == 'android-arm64-v8a'
        shell: bash
        run: |
          set -euo pipefail
          host_tools="$RUNNER_TEMP/turbodb-host-tools"
          mkdir -p "$host_tools"
          cc -std=c11 -O2 "$GITHUB_WORKSPACE/tools/lemon/lemon.c" \
            -o "$host_tools/lemon"
          test -x "$host_tools/lemon"
          echo "TURBODB_HOST_LEMON=$host_tools/lemon" >> "$GITHUB_ENV"
      - name: Prepare MSVC environment and Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'x64 MSVC was not found' }
          $developerEnvironment = & $env:ComSpec /d /s /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
          foreach ($entry in $developerEnvironment) {
            $name, $value = $entry -split '=', 2
            if ($name -match '^[A-Za-z_][A-Za-z0-9_]*$' -and $name -ne 'VCPKG_ROOT' -and
                $value -cne [Environment]::GetEnvironmentVariable($name)) {
              "$name=$value" >> $env:GITHUB_ENV
            }
          }
          choco install ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Ninja install failed' }
      - name: Install Java for Connector/J compatibility test
        if: inputs.tidessql-tests && matrix.rid != 'android-arm64-v8a'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch Connector/J compatibility fixture
        if: inputs.tidessql-tests && matrix.rid != 'android-arm64-v8a'
        shell: pwsh
        env:
          CONNECTOR_J_VERSION: '9.1.0'
        run: |
          $ErrorActionPreference = 'Stop'
          mvn --batch-mode dependency:get "-Dartifact=com.mysql:mysql-connector-j:$env:CONNECTOR_J_VERSION" -Dtransitive=false
          if ($LASTEXITCODE -ne 0) { throw 'Connector/J download failed' }
          $userHome = [Environment]::GetFolderPath('UserProfile')
          if ([string]::IsNullOrWhiteSpace($userHome)) { throw 'User profile directory was not found' }
          $jar = Join-Path $userHome ".m2/repository/com/mysql/mysql-connector-j/$env:CONNECTOR_J_VERSION/mysql-connector-j-$env:CONNECTOR_J_VERSION.jar"
          if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) { throw "Connector/J jar was not found: $jar" }
          "CONNECTOR_J_JAR=$jar" >> $env:GITHUB_ENV
      - name: Install published native SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid '${{ matrix.rid }}' -HostRid '${{ matrix.host }}'
      - name: Configure on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.rid }}' == android-arm64-v8a ]]; then
            cmake --preset '${{ matrix.preset }}' \
              -DLEMON_EXECUTABLE="$TURBODB_HOST_LEMON"
          else
            cmake --preset '${{ matrix.preset }}' -DTURBODB_MYSQL_CONNECTOR_J_JAR="${CONNECTOR_J_JAR:-}"
          fi
      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake --preset ci-windows-release -DTURBODB_MYSQL_CONNECTOR_J_JAR="%CONNECTOR_J_JAR%"
          if errorlevel 1 exit /b 1

      - name: Build on Unix
        if: runner.os != 'Windows'
        run: cmake --build --preset '${{ matrix.preset }}' --parallel 4
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake --build --preset ci-windows-release --parallel 4
          if errorlevel 1 exit /b 1

      - name: Test on Unix
        if: runner.os != 'Windows' && matrix.rid != 'android-arm64-v8a'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            mkdir -p "$RUNNER_TEMP/turbodb-cores"
            sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/turbodb-cores/%E"
            ulimit -c unlimited
          fi
          ctest --preset "$TURBODB_TEST_PRESET"
      - name: Diagnose Linux test crashes
        if: failure() && runner.os == 'Linux' && matrix.rid != 'android-arm64-v8a'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for core in "$RUNNER_TEMP"/turbodb-cores/*; do
            executable="${core##*/}"
            executable="${executable//!//}"
            gdb --batch "$executable" "$core" \
              -ex 'thread apply all bt' -ex 'info registers' -ex 'x/8i $pc'
          done
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          ctest --preset "%TURBODB_TEST_PRESET%"
          if errorlevel 1 exit /b 1

      - name: Install on Unix
        if: runner.os != 'Windows'
        run: cmake --build --preset 'install-${{ matrix.preset }}' --parallel 4
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake --build --preset install-ci-windows-release --parallel 4
          if errorlevel 1 exit /b 1
      - name: Test installed tidessqld
        if: inputs.tidessql-tests && matrix.rid != 'android-arm64-v8a'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executable = if ($IsWindows) { 'tidessqld.exe' } else { 'tidessqld' }
          $env:TURBODB_TEST_TIDESSQLD = Join-Path $env:TURBODB_CI_PKG_ROOT "turbodb/release/bin/$executable"
          if (-not (Test-Path -LiteralPath $env:TURBODB_TEST_TIDESSQLD -PathType Leaf)) {
            throw "installed tidessqld was not found: $env:TURBODB_TEST_TIDESSQLD"
          }
          ctest --preset $env:TURBODB_TEST_PRESET `
            -R '^(tidessqld_(process_e2e|cli|connector_j_e2e)|orm_mysql_tidessqld_e2e)$' `
            -j 1 --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'installed tidessqld tests failed' }
      - name: Stage native SDK
        if: ${{ !inputs.tidessql-tests }}
        shell: pwsh
        run: ./cmake/ci/stage-native-sdk.ps1 -Rid '${{ matrix.rid }}' -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.tidessql-tests }}
        with:
          name: turbodb-sdk-${{ matrix.rid }}
          path: build/stage/sdk/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

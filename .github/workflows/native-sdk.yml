name: Build native SDK

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ci

permissions:
  contents: read
  packages: read

jobs:
  sdk:
    name: ORM + SQLite/PostgreSQL/MySQL (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, rid: linux-x64, host: linux-x64, preset: ci-linux-release}
          - {os: ubuntu-24.04-arm, rid: linux-arm64, host: linux-arm64, preset: ci-linux-arm64-release}
          - os: macos-15
            rid: macos-arm64
            host: macos-arm64
            preset: ci-macos-arm64-release
          - {os: windows-2025, rid: windows-x64, host: windows-x64, preset: ci-windows-release}
          - {os: ubuntu-24.04, rid: android-arm64-v8a, host: linux-x64, preset: ci-android-release}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
        with:
          platform: ${{ matrix.rid }}
          preset: ${{ matrix.preset }}
      - name: Install Linux host tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build gdb
      - name: Install macOS host tools
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install autoconf ninja
      - name: Build bundled Lemon host tool
        if: matrix.rid == 'android-arm64-v8a'
        shell: bash
        run: |
          set -euo pipefail
          host_tools="$RUNNER_TEMP/turbodb-host-tools"
          mkdir -p "$host_tools"
          cc -std=c11 -O2 "$GITHUB_WORKSPACE/tools/lemon/lemon.c" \
            -o "$host_tools/lemon"
          test -x "$host_tools/lemon"
          echo "TURBODB_HOST_LEMON=$host_tools/lemon" >> "$GITHUB_ENV"
      - name: Prepare MSVC environment and Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'x64 MSVC was not found' }
          $developerEnvironment = & $env:ComSpec /d /s /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
          foreach ($entry in $developerEnvironment) {
            $name, $value = $entry -split '=', 2
            if ($name -match '^[A-Za-z_][A-Za-z0-9_]*$' -and $name -ne 'VCPKG_ROOT' -and
                $value -cne [Environment]::GetEnvironmentVariable($name)) {
              "$name=$value" >> $env:GITHUB_ENV
            }
          }
          choco install ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Ninja install failed' }
      - name: Install published native SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid '${{ matrix.rid }}' -HostRid '${{ matrix.host }}'
      - name: Configure on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.rid }}' == android-arm64-v8a ]]; then
            cmake --preset '${{ matrix.preset }}' \
              -DLEMON_EXECUTABLE="$TURBODB_HOST_LEMON" \
              -DTURBODB_BUILD_SQLITE_REVISION=ON
          else
            cmake --preset '${{ matrix.preset }}' \
              -DTURBODB_BUILD_SQLITE_REVISION=ON
          fi
      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake --preset ci-windows-release -DTURBODB_BUILD_SQLITE_REVISION=ON
          if errorlevel 1 exit /b 1

      - name: Build on Unix
        if: runner.os != 'Windows'
        run: cmake --build --preset '${{ matrix.preset }}' --parallel 4
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake --build --preset ci-windows-release --parallel 4
          if errorlevel 1 exit /b 1

      - name: Test on Unix
        if: runner.os != 'Windows' && matrix.rid != 'android-arm64-v8a'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            mkdir -p "$RUNNER_TEMP/turbodb-cores"
            sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/turbodb-cores/%E"
            ulimit -c unlimited
          fi
          ctest --preset '${{ matrix.preset }}'
      - name: Diagnose Linux test crashes
        if: failure() && runner.os == 'Linux' && matrix.rid != 'android-arm64-v8a'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for core in "$RUNNER_TEMP"/turbodb-cores/*; do
            executable="${core##*/}"
            executable="${executable//!//}"
            gdb --batch "$executable" "$core" \
              -ex 'thread apply all bt' -ex 'info registers' -ex 'x/8i $pc'
          done
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          ctest --preset ci-windows-release
          if errorlevel 1 exit /b 1

      - name: Install on Unix
        if: runner.os != 'Windows'
        run: cmake --build --preset 'install-${{ matrix.preset }}' --parallel 4
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake --build --preset install-ci-windows-release --parallel 4
          if errorlevel 1 exit /b 1
      - name: Qualify installed Revisioned SQLite C11 consumer
        if: matrix.rid != 'android-arm64-v8a'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cacheFile = Join-Path $env:GITHUB_WORKSPACE 'build/${{ matrix.preset }}/CMakeCache.txt'
          $cache = @{}
          foreach ($line in Get-Content -LiteralPath $cacheFile) {
            if ($line -match '^([A-Za-z0-9_]+):[^=]+=(.*)$') {
              $cache[$matches[1]] = $matches[2]
            }
          }
          foreach ($required in @('CMAKE_INSTALL_PREFIX','CMAKE_TOOLCHAIN_FILE',
                                  'VCPKG_TARGET_TRIPLET','VCPKG_INSTALLED_DIR')) {
            if ([string]::IsNullOrWhiteSpace($cache[$required])) {
              throw "Revision SDK consumer missing CMake cache value: $required"
            }
          }
          $prefix = $cache['CMAKE_INSTALL_PREFIX']
          $triplet = $cache['VCPKG_TARGET_TRIPLET']
          $installedDir = $cache['VCPKG_INSTALLED_DIR']
          $sdkConfigDir = Join-Path $prefix 'lib/cmake/TurboDB'
          if (-not (Test-Path -LiteralPath $sdkConfigDir)) {
            throw "TurboDB installed config missing: $sdkConfigDir"
          }
          $source = Join-Path $env:GITHUB_WORKSPACE 'sqlite_revision/tests/installed'
          $build = Join-Path $env:RUNNER_TEMP 'revision-installed-consumer'
          & cmake -S $source -B $build -G Ninja `
            '-DCMAKE_BUILD_TYPE=Release' `
            "-DCMAKE_TOOLCHAIN_FILE=$($cache['CMAKE_TOOLCHAIN_FILE'])" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            "-DVCPKG_INSTALLED_DIR=$installedDir" `
            "-DCMAKE_PREFIX_PATH=$prefix" `
            "-DTurboDB_DIR=$sdkConfigDir"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Revision C11 configure failed' }
          & cmake --build $build --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Installed Revision C11 link failed' }
          if ($IsWindows) {
            $env:PATH = (Join-Path $installedDir "$triplet/bin") + ';' +
              (Join-Path $env:SALTS_ROOT 'bin') + ';' + $env:PATH
            $exe = Join-Path $build 'turbodb_revision_installed_consumer.exe'
          } else {
            $libs = (Join-Path $installedDir "$triplet/lib") + ':' +
              (Join-Path $env:SALTS_ROOT 'lib')
            if ($IsMacOS) {
              $env:DYLD_LIBRARY_PATH = $libs + ':' + $env:DYLD_LIBRARY_PATH
            } else {
              $env:LD_LIBRARY_PATH = $libs + ':' + $env:LD_LIBRARY_PATH
            }
            $exe = Join-Path $build 'turbodb_revision_installed_consumer'
          }
          & $exe (Join-Path $env:RUNNER_TEMP 'revision-installed-consumer.db')
          if ($LASTEXITCODE -ne 0) { throw 'Installed Revision C11 runtime contract failed' }
      - name: Stage native SDK
        shell: pwsh
        run: >-
          ./cmake/ci/stage-native-sdk.ps1
          -Rid '${{ matrix.rid }}' -Version '${{ inputs.version }}'
          -InstallManifest '${{ github.workspace }}/build/${{ matrix.preset }}/install_manifest.txt'
      - name: Audit Linux ORM DSO closure
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          library="build/stage/sdk/linux-x64/lib/libturbo_orm.so"
          test -f "$library"
          if readelf --dyn-syms --wide "$library" |
             grep -Eq '[[:space:]]UND[[:space:]].*\bvec_[[:alnum:]_]*($|@)'; then
            echo "libturbo_orm.so leaks unresolved private CSTL symbols" >&2
            readelf --dyn-syms --wide "$library" |
              grep -E '[[:space:]]UND[[:space:]].*\bvec_[[:alnum:]_]*($|@)' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: turbodb-sdk-${{ matrix.rid }}
          path: build/stage/sdk/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

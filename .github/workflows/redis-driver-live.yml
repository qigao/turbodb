name: Redis Driver live contract

on:
  pull_request:
    branches: [master]
    paths:
      - "redis/**"
      - "drivers/redis/**"
      - "orm/tests/e2e/redis/**"
      - "orm/include/**"
      - "orm/src/**"
      - "orm/CMakeLists.txt"
      - "orm/tests/CMakeLists.txt"
      - "orm/tests/e2e/CMakeLists.txt"
      - "orm/tests/support/**"
      - "drivers/CMakeLists.txt"
      - "drivers/schema/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMake*Presets.json"
      - "presets/**"
      - "cmake/**"
      - ".github/actions/**"
      - "vcpkg*.json"
      - ".github/workflows/redis-driver-live.yml"
  push:
    branches: [master]
    paths:
      - "redis/**"
      - "drivers/redis/**"
      - "orm/tests/e2e/redis/**"
      - "orm/include/**"
      - "orm/src/**"
      - "orm/CMakeLists.txt"
      - "orm/tests/CMakeLists.txt"
      - "orm/tests/e2e/CMakeLists.txt"
      - "orm/tests/support/**"
      - "drivers/CMakeLists.txt"
      - "drivers/schema/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMake*Presets.json"
      - "presets/**"
      - "cmake/**"
      - ".github/actions/**"
      - "vcpkg*.json"
      - ".github/workflows/redis-driver-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: redis-driver-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redis-live:
    name: Redis Stack live Driver CRUD
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact TurboDB head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-native

      - name: Restore published native SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid linux-x64

      - name: Install runtime/build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build redis-tools

      - name: Build and run Redis live contracts
        shell: bash
        env:
          ORM_REDIS_PORT: "6379"
          TURBODB_REDIS_TEST_PORT: "6379"
        run: |
          set -euo pipefail
          cmake --preset ci-linux-e2e
          cmake --build --preset ci-linux-e2e --target orm_redis_live_driver_test --parallel 4

          mkdir -p evidence/redis-live
          ctest --preset ci-linux-e2e -R '^orm_redis_live_driver$' --output-on-failure --output-junit evidence/redis-live/tests.xml 2>&1 | tee evidence/redis-live/orm-ctest.log

      - name: Keep Redis test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-driver-live-${{ github.sha }}
          path: evidence/redis-live/
          if-no-files-found: warn

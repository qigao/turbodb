name: TurboDB Studio Windows

on:
  pull_request:
    paths:
      - "app/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "vcpkg.json"
      - ".github/workflows/studio-windows.yml"
      - ".github/actions/setup-native/**"
      - "cmake/ci/stage-studio.ps1"
  push:
    branches: [master]
    paths:
      - "app/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "vcpkg.json"
      - ".github/workflows/studio-windows.yml"
      - ".github/actions/setup-native/**"
      - "cmake/ci/stage-studio.ps1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: studio-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio editor (windows-x64)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-native
        with:
          platform: windows-x64-studio

      - name: Locate MSVC and install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'x64 MSVC was not found' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
          choco install ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Ninja install failed' }

      - name: Install published native SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdks.ps1 -Rid windows-x64

      - name: Configure and build Studio editor
        shell: cmd
        run: |
          set "TURBODB_PINNED_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%TURBODB_PINNED_VCPKG_ROOT%"
          cmake --preset ci-windows-release -DTURBODB_BUILD_APP=ON -DTURBODB_BUILD_DBTOOLS=OFF -DBUILD_TESTS=ON -DBUILD_E2E_TESTS=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset ci-windows-release --parallel 4
          if errorlevel 1 exit /b 1
          ctest --preset ci-windows-release -R "^turbodb-app-" --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Stage Studio runtime package
        shell: pwsh
        run: ./cmake/ci/stage-studio.ps1 -StudioExe ./build/ci-windows-release/bin/TurboDBStudio.exe -StageDir ./build/stage/studio -VcpkgBin "./vcpkg_installed/$env:QIGAO_VCPKG_WINDOWS_TRIPLET/bin" -SaltsBin "$env:SALTS_ROOT/bin" -SaltsUtilsBin "$env:SALTS_UTILS_ROOT/bin"

      - uses: actions/upload-artifact@v4
        with:
          name: turbodb-studio-windows-x64-${{ github.sha }}
          path: build/stage/studio
          if-no-files-found: error

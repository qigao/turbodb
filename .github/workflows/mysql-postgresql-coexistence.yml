name: MySQL + PostgreSQL Driver coexistence

on:
  pull_request:
    branches: [master]
    paths:
      - "orm/src/dbs/mysql/**"
      - "orm/src/dbs/postgres/**"
      - "orm/src/runtime/**"
      - "orm/src/driver/**"
      - "orm/tests/integration/mysql_postgresql_coexistence_test.c"
      - "orm/CMakeLists.txt"
      - "vcpkg.json"
      - ".github/workflows/mysql-postgresql-coexistence.yml"
  push:
    branches: [master]
    paths:
      - "orm/src/dbs/mysql/**"
      - "orm/src/dbs/postgres/**"
      - "orm/src/runtime/**"
      - "orm/src/driver/**"
      - "orm/tests/integration/mysql_postgresql_coexistence_test.c"
      - "orm/CMakeLists.txt"
      - "vcpkg.json"
      - ".github/workflows/mysql-postgresql-coexistence.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mysql-postgresql-coexistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coexistence:
    name: MySQL 8.0.40 + PostgreSQL 17.6 canonical runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0.40
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: turbodb
          MYSQL_USER: turbodb
          MYSQL_PASSWORD: turbodbpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: turbodb
          POSTGRES_USER: turbodb
          POSTGRES_PASSWORD: turbodb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U turbodb -d turbodb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout exact TurboDB head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure canonical vcpkg tool and shared cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore canonical re2c host tool
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
        with:
          version: "4.6.3"

      - name: Restore published Salts SDK pair
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-versioned-native-sdks.ps1 -Rid linux-x64

      - name: Restore MySQL and PostgreSQL native dependency closure
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/mysql-postgresql-vcpkg"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$install_root" \
            --triplet=x64-linux \
            --x-feature=mysql \
            --x-feature=postgresql
          status="$install_root/vcpkg/status"
          test -f "$status"
          grep -F "Package: boringssl" "$status"
          grep -F "Package: libpq" "$status"
          if grep -Fq "Package: openssl" "$status"; then
            cat "$status"
            echo "coexistence gate must not pull OpenSSL into the MySQL feature closure" >&2
            exit 1
          fi
          echo "TURBODB_COEXIST_VCPKG_ROOT=$install_root" >> "$GITHUB_ENV"

      - name: Prepare verified MySQL TLS identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mysql-tls" "$GITHUB_WORKSPACE/evidence/mysql-postgresql"
          cid="$(docker ps --filter ancestor=mysql:8.0.40 --format '{{.ID}}' | head -n 1)"
          test -n "$cid"

          docker cp "$cid:/var/lib/mysql/ca.pem" "$RUNNER_TEMP/mysql-tls/ca.pem"
          docker cp "$cid:/var/lib/mysql/server-cert.pem" "$RUNNER_TEMP/mysql-tls/server-cert.pem"
          openssl verify -CAfile "$RUNNER_TEMP/mysql-tls/ca.pem" \
            "$RUNNER_TEMP/mysql-tls/server-cert.pem"
          server_name="$(openssl x509 -in "$RUNNER_TEMP/mysql-tls/server-cert.pem" \
            -noout -subject -nameopt sep_multiline \
            | sed -n 's/^[[:space:]]*CN[[:space:]]*=[[:space:]]*//p' \
            | head -n 1)"
          test -n "$server_name"

          {
            echo "ORM_MYSQL_HOST=127.0.0.1"
            echo "ORM_MYSQL_PORT=3306"
            echo "ORM_MYSQL_USER=turbodb"
            echo "ORM_MYSQL_PASSWORD=turbodbpass"
            echo "ORM_MYSQL_DATABASE=turbodb"
            echo "ORM_MYSQL_CA_FILE=$RUNNER_TEMP/mysql-tls/ca.pem"
            echo "ORM_MYSQL_SERVER_NAME=$server_name"
            echo "TURBODB_ORM_PGSQL_TEST_CONNINFO=host=127.0.0.1 port=5432 dbname=turbodb user=turbodb password=turbodb"
          } >> "$GITHUB_ENV"

      - name: Build and run canonical Driver coexistence
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/mysql-postgresql-build"
          evidence="$GITHUB_WORKSPACE/evidence/mysql-postgresql"

          cmake -S "$GITHUB_WORKSPACE" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DVCPKG_INSTALLED_DIR="$TURBODB_COEXIST_VCPKG_ROOT" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DORM_BUILD_TESTS=ON \
            -DORM_BUILD_MYSQL_DRIVER=ON \
            -DORM_BUILD_POSTGRESQL_DRIVER=ON \
            -DORM_BUILD_SQLITE_DRIVER=OFF \
            -DORM_BUILD_LEGACY_POSTGRESQL_COMPONENT=OFF \
            -DORM_BUILD_REDIS_DRIVER=OFF \
            -DORM_BUILD_MONGODB_DRIVER=OFF \
            -DORM_BUILD_TIDESDB_DRIVER=OFF \
            -DORM_MYSQL_LIVE_TESTS=OFF \
            -DORM_POSTGRES_LIVE_TESTS=OFF \
            -DTURBODB_BUILD_REDIS=OFF \
            -DTURBODB_BUILD_DBTOOLS=OFF \
            -DTURBODB_DBTOOLS_WITH_SQLITE=OFF \
            -DTURBODB_DBTOOLS_WITH_PGSQL=OFF

          cmake --build "$build" --target \
            orm_mysql_driver orm_postgresql_driver \
            orm_mysql_postgresql_coexistence_test --parallel 4

          app="$build/bin/orm_mysql_postgresql_coexistence_test"
          mysql_plugin="$build/bin/turbodb_driver_mysql.so"
          postgresql_plugin="$build/bin/turbodb_driver_postgresql.so"
          core="$build/bin/libturbo_orm.so"
          test -x "$app"
          test -f "$mysql_plugin"
          test -f "$postgresql_plugin"

          export LD_LIBRARY_PATH="$build/bin:$TURBODB_COEXIST_VCPKG_ROOT/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ORM_MYSQL_PLUGIN="$mysql_plugin" \
          ORM_POSTGRESQL_PLUGIN="$postgresql_plugin" \
            "$app"

          ldd "$core" > "$evidence/core-ldd.txt"
          ldd "$mysql_plugin" > "$evidence/mysql-driver-ldd.txt"
          ldd "$postgresql_plugin" > "$evidence/postgresql-driver-ldd.txt"
          if grep -Eiq 'cnet|libpq|postgres|libmysql|mariadb' "$evidence/core-ldd.txt"; then
            cat "$evidence/core-ldd.txt"
            echo "generic core owns a Driver-native dependency" >&2
            exit 1
          fi
          if grep -Eiq 'libmysql|mariadb|boost|libtirpc' "$evidence/mysql-driver-ldd.txt"; then
            cat "$evidence/mysql-driver-ldd.txt"
            echo "MySQL Driver contains a forbidden native dependency" >&2
            exit 1
          fi

          sha256sum "$core" "$app" "$mysql_plugin" "$postgresql_plugin" \
            > "$evidence/binaries.sha256"
          {
            echo "head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "mysql=8.0.40"
            echo "postgresql=17.6"
            echo "salts=1.8.0"
            echo "saltsutils=4.1.0"
            echo "runtime=one"
            echo "drivers=mysql,postgresql"
          } > "$evidence/qualification.txt"

          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code

      - name: Keep coexistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-postgresql-coexistence-${{ github.sha }}
          path: evidence/mysql-postgresql/
          if-no-files-found: warn

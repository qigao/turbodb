; Copy beside TurboDBStudio.exe, or use Load INI in New Connection.
; UTF-8. File paths are relative to this INI file's directory.
[studio]
default_connection = local

[connection.local]
driver = sqlite
module_path = turbodb_driver_sqlite.dll
display_name = Local SQLite
database = :memory:

; Uncomment and adjust a network profile to use it.
; [connection.reporting]
; driver = postgresql
; module_path = turbodb_driver_postgresql.dll
; database = reporting
; host = db.example.com
; port = 5432
; user = reader
; ca_certificate = certs/ca.pem
; tls_server_name = db.example.com
; password_env = TURBODB_REPORTING_PASSWORD
